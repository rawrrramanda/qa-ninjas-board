function openCropperWithFile(targetManagerId, file, onSaved){
  const CONTAINER_SIZE = 260;
  const OUTPUT_SIZE = 300;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card" style="width:320px;text-align:center;">
      <h3>Update profile picture</h3>
      <div class="crop-container" id="cropContainer"><img id="cropImg" alt=""></div>
      <div class="crop-zoom-row">
        <span style="font-size:12px;">&#128269;</span>
        <input type="range" id="zoomSlider" min="100" max="300" value="100">
      </div>
      <div class="hint" style="margin-top:8px;">Drag to reposition, use the slider to zoom.</div>
      <div class="modal-actions">
        <button class="btn btn-sm" id="cancelCropBtn">Cancel</button>
        <button class="btn btn-sm btn-primary" id="saveCropBtn">Save</button>
      </div>
    </div>
  `;
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  document.getElementById('cancelCropBtn').addEventListener('click', ()=> overlay.remove());

  const img = document.getElementById('cropImg');
  const container = document.getElementById('cropContainer');
  const zoomSlider = document.getElementById('zoomSlider');
  const objectUrl = URL.createObjectURL(file);
  img.src = objectUrl;

  let baseScale = 1, userScale = 1, offsetX = 0, offsetY = 0;
  let dragging = false, dragStartX = 0, dragStartY = 0, startOffsetX = 0, startOffsetY = 0;

  function clampOffsets(){
    const totalScale = baseScale * userScale;
    const dispW = img.naturalWidth * totalScale;
    const dispH = img.naturalHeight * totalScale;
    offsetX = Math.min(0, Math.max(CONTAINER_SIZE - dispW, offsetX));
    offsetY = Math.min(0, Math.max(CONTAINER_SIZE - dispH, offsetY));
  }
  function applyTransform(){
    const totalScale = baseScale * userScale;
    img.style.width = (img.naturalWidth * totalScale) + 'px';
    img.style.height = (img.naturalHeight * totalScale) + 'px';
    img.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
  }

  img.onload = ()=>{
    // Cover-fit: the smaller natural dimension exactly fills the circular viewport at userScale=1.
    baseScale = CONTAINER_SIZE / Math.min(img.naturalWidth, img.naturalHeight);
    userScale = 1;
    zoomSlider.value = 100;
    offsetX = (CONTAINER_SIZE - img.naturalWidth * baseScale) / 2;
    offsetY = (CONTAINER_SIZE - img.naturalHeight * baseScale) / 2;
    clampOffsets();
    applyTransform();
  };

  zoomSlider.addEventListener('input', ()=>{
    // Keep the center point stable while zooming, rather than the top-left corner.
    const oldTotal = baseScale * userScale;
    const cx = CONTAINER_SIZE/2 - offsetX, cy = CONTAINER_SIZE/2 - offsetY; // focal point in image-display coords
    userScale = zoomSlider.value / 100;
    const newTotal = baseScale * userScale;
    offsetX = CONTAINER_SIZE/2 - cx * (newTotal/oldTotal);
    offsetY = CONTAINER_SIZE/2 - cy * (newTotal/oldTotal);
    clampOffsets();
    applyTransform();
  });

  const startDrag = (x,y)=>{ dragging = true; dragStartX = x; dragStartY = y; startOffsetX = offsetX; startOffsetY = offsetY; container.classList.add('dragging'); };
  const moveDrag = (x,y)=>{
    if(!dragging) return;
    offsetX = startOffsetX + (x - dragStartX);
    offsetY = startOffsetY + (y - dragStartY);
    clampOffsets();
    applyTransform();
  };
  const endDrag = ()=>{ dragging = false; container.classList.remove('dragging'); };

  container.addEventListener('mousedown', e=> startDrag(e.clientX, e.clientY));
  window.addEventListener('mousemove', e=> moveDrag(e.clientX, e.clientY));
  window.addEventListener('mouseup', endDrag);
  container.addEventListener('touchstart', e=>{ const t=e.touches[0]; startDrag(t.clientX, t.clientY); }, {passive:true});
  container.addEventListener('touchmove', e=>{ const t=e.touches[0]; moveDrag(t.clientX, t.clientY); }, {passive:true});
  container.addEventListener('touchend', endDrag);

  document.getElementById('saveCropBtn').addEventListener('click', async ()=>{
    const saveBtn = document.getElementById('saveCropBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    const totalScale = baseScale * userScale;
    const outputScale = OUTPUT_SIZE / CONTAINER_SIZE;
    const canvas = document.createElement('canvas');
    canvas.width = OUTPUT_SIZE; canvas.height = OUTPUT_SIZE;
    const ctx = canvas.getContext('2d');
    // Map the visible crop-container region back to source image pixel coordinates.
    const sx = -offsetX / totalScale, sy = -offsetY / totalScale;
    const sSize = CONTAINER_SIZE / totalScale;
    ctx.drawImage(img, sx, sy, sSize, sSize, 0, 0, OUTPUT_SIZE, OUTPUT_SIZE);
    canvas.toBlob(async (blob)=>{
      const ok = await uploadAvatarBlob(targetManagerId, blob);
      URL.revokeObjectURL(objectUrl);

    }, 'image/png', 0.92);
  });
}

// A DM's stored `name` is only meaningful from its creator's point of view,
// so the display name is computed per-viewer instead: whichever participant
// isn't you.
function dmDisplayName(channel){
  if(channel.type !== 'dm') return channel.name;
  const otherId = channel.dm_user_a === currentManagerId ? channel.dm_user_b : channel.dm_user_a;
  return managerName(otherId);
}

async function findOrCreateDM(otherId){
  const existing = channels.find(c => c.type === 'dm' &&
    ((c.dm_user_a === currentManagerId && c.dm_user_b === otherId) ||
     (c.dm_user_a === otherId && c.dm_user_b === currentManagerId)));
  if(existing){ currentChannelId = existing.id; refresh(); return; }

  const { data, error } = await supabaseClient.from('channels').insert({
    name: managerName(otherId), type: 'dm', is_fixed: false,
    created_by: currentManagerId, dm_user_a: currentManagerId, dm_user_b: otherId
  }).select().single();

  if(error){
    if(error.code === '23505'){
      // Someone else's near-simultaneous request won the race — the database
      // rejected ours as a duplicate. That's expected now, not a failure:
      // just pick up the conversation that already exists.
      await loadChannels();
      const nowExisting = channels.find(c => c.type === 'dm' &&
        ((c.dm_user_a === currentManagerId && c.dm_user_b === otherId) ||
         (c.dm_user_a === otherId && c.dm_user_b === currentManagerId)));
      if(nowExisting){ currentChannelId = nowExisting.id; refresh(); return; }
    }
    console.error('create dm failed', error);
    showToast('Could not start conversation');
    return;
  }
  channels.push(data);
  currentChannelId = data.id;
  refresh();
}

/* ================= Team Chat: voice channels (Agora) =================
   Audio routes through Agora's managed relay infrastructure rather than
   connecting browsers directly to each other — this is what fixed the
   NAT/network-degradation issues the original free peer-to-peer approach
   was hitting. Presence (who's in which channel, for the sidebar) still
   rides on lightweight Supabase Realtime, unrelated to the audio itself. */

// Prevents overlapping join/leave/mute actions — clicking mute rapidly (or
// clicking leave while a mute toggle is still in flight) was racing against
// itself, occasionally corrupting the connection and leaving the leave
// button unresponsive. Only one voice action runs at a time now; the rest
// are quietly ignored rather than queued, which is the right call for
// something like a mute button.
let voiceActionBusy = false;
async function runVoiceAction(fn){
  if(voiceActionBusy) return;
  voiceActionBusy = true;
  try{ await fn(); }
  catch(e){ console.error('voice action failed', e); }
  finally{ voiceActionBusy = false; }
}

// Watches a voice channel's occupancy WITHOUT joining audio — lets the sidebar
// show who's in every voice channel, not just the one you've joined. Since we
// never call .track() here, we never actually appear as a participant.
function subscribeVoicePresenceObserver(channelId){
  if(voiceObserverChannels[channelId]) return;
  if(voiceChannelId === channelId) return; // already have full presence via the joined channel
  const ch = supabaseClient.channel('voice_' + channelId, { config: { presence: { key: 'observer_' + uid() } } });
  ch.on('presence', { event: 'sync' }, ()=>{
    const state = ch.presenceState();
    const occ = {};
    Object.keys(state).forEach(key=>{
      occ[key] = { name: state[key][0].name, muted: !!state[key][0].muted, deafened: !!state[key][0].deafened };
    });
    voiceChannelOccupants[channelId] = occ;
    if(currentView === 'chat') refreshVoiceUI();
  });
  ch.subscribe();
  voiceObserverChannels[channelId] = ch;
}
function subscribeAllVoicePresenceObservers(){
  channels.filter(c=>c.type==='voice').forEach(c=> subscribeVoicePresenceObserver(c.id));
}

/* ---- Local audio via Agora — replaces the direct WebRTC mesh. Actual audio
   now routes through Agora's managed relay infrastructure instead of
   connecting browsers directly to each other, which is what fixes the
   NAT/network-degradation issues the P2P approach was hitting. Speaking
   detection and mute are both handled through Agora's own APIs, which are
   built and tested specifically for this, rather than raw browser audio
   APIs that turned out to have real edge-case bugs. ---- */
let agoraClient = null;
let agoraLocalAudioTrack = null;
let agoraRemoteUsers = {};   // uid -> Agora user object

async function joinVoiceChannel(channelId){
  if(voiceChannelId){ await leaveVoiceChannel(); }

  let tokenData;
  try{
    const { data, error } = await supabaseClient.functions.invoke('agora-token', { body: { channelName: channelId } });
    if(error || !data || data.error) throw new Error((data && data.error) || (error && error.message) || 'token request failed');
    tokenData = data;
  }catch(e){
    console.error('agora token request failed', e);
    showToast('Could not start voice call — check console');
    return;
  }

  // Give up the passive observer for this channel — the joined presence below replaces it.
  if(voiceObserverChannels[channelId]){
    supabaseClient.removeChannel(voiceObserverChannels[channelId]);
    delete voiceObserverChannels[channelId];
  }

  voiceChannelId = channelId;
  voiceChannelOccupants[channelId] = {};
  voiceMuted = false;
  voiceDeafened = false;
  agoraRemoteUsers = {};

  agoraClient = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });

  agoraClient.on('user-published', async (user, mediaType)=>{
    if(mediaType !== 'audio') return;
    try{
      await agoraClient.subscribe(user, mediaType);
      agoraRemoteUsers[user.uid] = user;
      user.audioTrack.play();
      if(voiceDeafened){ try{ user.audioTrack.setVolume(1); }catch(e){} }
    }catch(e){ console.error('agora subscribe failed', e); }
  });
  agoraClient.on('user-unpublished', (user)=>{
    if(user.audioTrack){ try{ user.audioTrack.stop(); }catch(e){} }
    delete agoraRemoteUsers[user.uid];
  });
  agoraClient.on('user-left', (user)=>{
    if(user.audioTrack){ try{ user.audioTrack.stop(); }catch(e){} }
    delete agoraRemoteUsers[user.uid];
  });

  // Speaking indicator, driven by Agora's own volume metering rather than a
  // hand-rolled Web Audio analyser — sidesteps the audio-context-suspension
  // issues that kept breaking the self-view ring.
  agoraClient.enableAudioVolumeIndicator();
  agoraClient.on('volume-indicator', (volumes)=>{
    volumes.forEach(v=>{
      const isSelfMuted = v.uid === currentManagerId && voiceMuted;
      const el = document.getElementById('voice-avatar-' + v.uid);
      if(el) el.classList.toggle('speaking', v.level > 12 && !isSelfMuted);
    });
  });

  try{
    await agoraClient.join(tokenData.appId, channelId, tokenData.token, currentManagerId);
    agoraLocalAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
    await agoraClient.publish([agoraLocalAudioTrack]);
  }catch(e){
    console.error('agora join failed', e);
    showToast('Could not join voice call — check microphone permissions');
    voiceChannelId = null;
    agoraClient = null;
    return;
  }

  // Presence here is purely for the sidebar "who's in this channel" display —
  // unrelated to Agora, same lightweight system used for channels you
  // haven't joined at all.
  const me = currentManagerRecord();
  const myName = me ? me.name : 'Manager';
  const thisVoiceChannel = supabaseClient.channel('voice_' + channelId, {
    config: { presence: { key: currentManagerId } }
  });
  voiceRealtimeChannel = thisVoiceChannel;

  thisVoiceChannel
    .on('presence', { event: 'sync' }, ()=>{
      const state = thisVoiceChannel.presenceState();
      console.log('[DIAGNOSTIC] raw presence state:', JSON.stringify(state));
      const occ = {};
      Object.keys(state).forEach(key=>{
        const meta = state[key][0];
        console.log('[DIAGNOSTIC] parsed for', key, '-> meta:', JSON.stringify(meta));
        occ[key] = { name: meta.name, muted: !!meta.muted, deafened: !!meta.deafened };
      });
      voiceChannelOccupants[channelId] = occ;
      if(currentView === 'chat') refreshVoiceUI();
    })
    .subscribe(async (status)=>{
      if(status === 'SUBSCRIBED'){
        try{ await thisVoiceChannel.track({ name: myName, muted: voiceMuted, deafened: voiceDeafened }); }
        catch(e){ console.error('voice presence track failed', e); }
      }
    });
}

async function leaveVoiceChannel(){
  if(!voiceChannelId) return;
  const leftChannelId = voiceChannelId;
  const presenceChannel = voiceRealtimeChannel;
  const client = agoraClient;
  const localTrack = agoraLocalAudioTrack;

  // Clear only what the UI actually reads — instantly, synchronously — so
  // the button/room updates the moment you click, before any real teardown
  // work happens at all.
  voiceRealtimeChannel = null;
  voiceChannelId = null;
  agoraClient = null;
  agoraLocalAudioTrack = null;
  agoraRemoteUsers = {};
  voiceChannelOccupants[leftChannelId] = {};
  voiceMuted = false;
  voiceDeafened = false;

  // Real teardown (closing the Agora connection, releasing the mic) happens
  // right after, in the background — deferred so it can't delay the visual
  // update even by a frame. Order matters here: unpublish FIRST so the
  // server immediately stops delivering your audio to everyone else, before
  // the local track is torn down — closing the track first (what this used
  // to do) could leave a stale publish on the server side, which is exactly
  // why audio kept being heard after "leaving."
  setTimeout(async ()=>{
    if(client && localTrack){
      try{ await client.unpublish([localTrack]); }
      catch(e){ console.error('agora unpublish failed', e); }
    }
    if(localTrack){
      try{ localTrack.stop(); localTrack.close(); }
      catch(e){ console.error('agora track close failed', e); }
    }
    if(client){
      try{ await client.leave(); }
      catch(e){ console.error('agora client leave failed', e); }
    }
  }, 0);

  if(presenceChannel){
    (async ()=>{
      try{ await presenceChannel.untrack(); }catch(e){ console.error('voice untrack failed', e); }
      try{ await supabaseClient.removeChannel(presenceChannel); }catch(e){ console.error('voice removeChannel failed', e); }
      // Only resume passive observation once the old channel (same topic
      // name) is fully gone — creating the new one too early, while the old
      // one was still being torn down, was leaving the sidebar showing
      // people who'd already left.
      subscribeVoicePresenceObserver(leftChannelId);
    })();
  }else{
    subscribeVoicePresenceObserver(leftChannelId);
  }
}

async function toggleVoiceMute(){
  if(!agoraLocalAudioTrack || !agoraClient) return;
  voiceMuted = !voiceMuted;
  refreshVoiceUI(); // instant feedback — don't wait on the network operation below to update the button

  // Mute/unmute by unpublishing/republishing the SAME track object, rather
  // than toggling its enabled state — this never touches microphone
  // acquisition at all (the track itself is never destroyed or recreated),
  // which avoids whatever was triggering a fresh permission prompt on
  // every unmute with the enabled-toggle approach.
  try{
    if(voiceMuted){
      await agoraClient.unpublish([agoraLocalAudioTrack]);
    }else{
      await agoraClient.publish([agoraLocalAudioTrack]);
    }
  }catch(e){ console.error('agora mute failed', e); }

  // Let everyone else in the call see the updated mute state, not just yourself.
  await broadcastVoicePresenceState();
}

async function broadcastVoicePresenceState(){
  if(!voiceRealtimeChannel){ console.log('[DIAGNOSTIC] broadcast skipped — voiceRealtimeChannel is null'); return; }
  const me = currentManagerRecord();
  const payload = { name: me ? me.name : 'Manager', muted: voiceMuted, deafened: voiceDeafened };
  console.log('[DIAGNOSTIC] sending presence broadcast:', JSON.stringify(payload));
  try{
    const result = await voiceRealtimeChannel.track(payload);
    console.log('[DIAGNOSTIC] track() call result:', result);
  }catch(e){ console.error('presence broadcast failed', e); }
}

// Deafen mutes what you HEAR, not just what you send. Turning it on also
// mutes your mic (Discord's convention — you probably shouldn't be talking
// if you can't hear anyone), but turning it back off does not auto-unmute;
// your mic state stays whatever you left it at.
// Updates the sidebar + voice room from state that's already correct
// locally — no network round-trip, unlike a full refresh(). Mute, deafen,
// and presence changes never actually change the channel list, so there's
// nothing to re-fetch; re-fetching anyway was the whole reason this used to
// feel laggy on every single toggle.
// Rebuilds the sidebar + main chat content from state that's already correct
// locally — no network round-trip to reload channels, unlike a full
// refresh(). Used for anything chat-related that never actually changes the
// channel list itself: voice mute/deafen, reactions, sticker uploads, etc.
async function refreshChatLight(){
  if(currentView !== 'chat') return;
  const main = document.getElementById('main');
  if(!main) return;
  await renderChat(main, true);
}
const refreshVoiceUI = refreshChatLight; // kept as an alias for existing voice call sites

async function toggleDeafen(){
  voiceDeafened = !voiceDeafened;
  // Near-silent rather than literally 0 — some browsers throttle background
  // tabs more aggressively once they're producing zero audio output at all,
  // which was very likely why staying deafened + inactive was dropping calls.
  // 1/100 is inaudible in practice but keeps the tab classified as "playing
  // audio," avoiding that extra throttling.
  Object.values(agoraRemoteUsers).forEach(user=>{
    if(user.audioTrack){
      try{ user.audioTrack.setVolume(voiceDeafened ? 1 : 100); }catch(e){}
    }
  });
  refreshVoiceUI(); // instant feedback — the mute-triggering/broadcast calls below can take a moment
  if(voiceDeafened && !voiceMuted){
    await toggleVoiceMute(); // this already broadcasts the updated state, including deafened
  }else{
    await broadcastVoicePresenceState();
  }
}

/* ================= Access gate (real Supabase Auth) ================= */
let managersList = [];   // all manager profiles, fetched from the `managers` table
let authenticated = false;

function managerName(id){ return (managersList.find(m=>m.user_id===id)?.name) || 'Unassigned'; }
function currentManagerRecord(){ return managersList.find(m=>m.user_id===currentManagerId) || null; }

async function loadManagersList(){
  const { data, error } = await supabaseClient.from('managers').select('*').order('created_at');
  if(error){ console.error('loadManagersList failed', error); showToast('Could not load manager list — check console'); }
  managersList = error ? [] : (data || []);
}

// Makes sure a logged-in auth user has a row in `managers` (name + email + admin flag).
// The very first manager ever created on a fresh board becomes admin automatically;
// everyone after that starts as a regular (non-admin) manager. Also backfills email
// on older rows that predate the email column, so admins can send reset links.
async function ensureOwnManagerProfile(name){
  const { data: { user } } = await supabaseClient.auth.getUser();
  const email = user?.email || null;

  const { data: existing, error: selErr } = await supabaseClient.from('managers').select('*').eq('user_id', currentManagerId).maybeSingle();
  if(selErr){ console.error('manager profile lookup failed', selErr); showToast('Could not load your profile — check console'); return null; }

  if(existing){
    if(!existing.email && email){
      await supabaseClient.from('managers').update({ email }).eq('user_id', currentManagerId);
      existing.email = email;
    }
    return existing;
  }

  const { count } = await supabaseClient.from('managers').select('*', { count: 'exact', head: true });
  const isFirstEver = !count || count === 0;
  const row = { user_id: currentManagerId, name: name || 'New Manager', email, is_admin: isFirstEver };
  const { error: insErr } = await supabaseClient.from('managers').insert(row);
  if(insErr){ console.error('manager profile creation failed', insErr); showToast('Could not create your profile — check console'); return null; }
  return row;
}

async function ensureSeedRoster(seedManagerId){
  const existingRoster = await storageGet('roster');
  if(existingRoster && existingRoster.length) return;
  const seeded = SEED_POOL.map(([name, language, shift, type, offDays])=>({
    id: uid(), name, language, shift, type, offDays,
    active: SEED_ACTIVE.has(name.toLowerCase()), managerId: seedManagerId
  }));
  await storageSet('roster', seeded);
}

/* ================= Live updates (Supabase Realtime) ================= */
// Requires "kv_store" and "managers" to be added to the supabase_realtime
// publication in the database (one-time SQL setup, not code).
let realtimeChannelsActive = false;

// If someone's actively typing in a field, applying a live update right now
// would rebuild the DOM under them and interrupt it. Defer the update until
// they're done (blur), rather than skip it entirely. Supports two levels:
// a light main-content refresh, or a full render (needed when the sidebar
// itself has to change, e.g. a nav badge count).
let pendingRealtimeAction = null; // null | 'refresh' | 'render'
function requestRealtimeUpdate(kind){
  const active = document.activeElement;
  const isEditing = active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
  if(isEditing){
    if(pendingRealtimeAction !== 'render') pendingRealtimeAction = kind;
    return;
  }
  if(kind === 'render') render(); else refresh();
}
function requestRealtimeRefresh(){ requestRealtimeUpdate('refresh'); }
document.addEventListener('focusout', ()=>{
  if(pendingRealtimeAction){
    const kind = pendingRealtimeAction;
    pendingRealtimeAction = null;
    setTimeout(()=> kind === 'render' ? render() : refresh(), 150); // let any blur-triggered save finish first
  }
});

function handleKvStoreChange(payload){
  const row = payload.new && payload.new.key ? payload.new : payload.old;
  if(!row || !row.key) return;
  const key = row.key;
  const deleted = payload.eventType === 'DELETE';

  if(key === 'roster'){
    roster = deleted ? [] : (payload.new.value || []);
    requestRealtimeRefresh();
    return;
  }
  if(key.startsWith('attendance:')){
    const date = key.slice('attendance:'.length);
    if(attendanceCache[date] !== undefined){
      attendanceCache[date] = deleted ? {} : (payload.new.value || {});
    }
    if(currentView === 'today' || currentView === 'overview') requestRealtimeRefresh();
    return;
  }
  if(key.startsWith('violations:')){
    const interpId = key.slice('violations:'.length);
    if(violationsCache[interpId] !== undefined){
      violationsCache[interpId] = deleted ? [] : (payload.new.value || []);
    }
    if(currentView === 'performance' || currentView === 'overview') requestRealtimeRefresh();
    return;
  }
  if(key === 'import-review-log'){
    importReviewCache = deleted ? [] : (payload.new.value || []);
    if(currentView === 'performance') requestRealtimeRefresh();
    return;
  }
}

async function handleManagersChange(payload){
  await loadManagersList();
  await warmAvatarUrlCache();
  // Your own record changing (name, avatar, etc.) needs a full render since
  // that's what updates the sidebar's "Signed in as" section — this is
  // exactly what was missing when an admin changed someone else's picture
  // and it never showed up on that person's own screen. Anyone else's
  // record changing only needs the lighter refresh.
  const changedUserId = (payload && payload.new && payload.new.user_id) || (payload && payload.old && payload.old.user_id);
  requestRealtimeUpdate(changedUserId === currentManagerId ? 'render' : 'refresh');
}

// A short, self-contained "ding" — generated on the fly rather than an audio
// file, so there's nothing to host and no risk of it going stale. Creates a
// fresh AudioContext per play and closes it right after, avoiding the
// suspended-context issues that caused real trouble with the old speaking
// indicator.
function playNotificationSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const play = ()=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.28);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
      setTimeout(()=>{ ctx.close().catch(()=>{}); }, 500);
    };
    // A freshly-created context often starts suspended, especially in a
    // background/unfocused tab — exactly the situation this needs to work
    // in. Explicitly resume before playing instead of assuming it's running.
    if(ctx.state === 'suspended'){
      ctx.resume().then(play).catch(()=>{ ctx.close().catch(()=>{}); });
    }else{
      play();
    }
  }catch(e){ console.error('notification sound failed', e); }
}

function handleNewMessageForUnread(payload){
  const msg = payload.new;
  if(!msg || msg.user_id === currentManagerId) return; // never notify on your own messages

  // Defense in depth: only act on this if the channel is one we actually
  // have loaded (which only happens via a real, RLS-respecting query) —
  // don't trust the realtime event alone to have been correctly scoped to
  // channels/DMs this user can see.
  const channelVisible = channels.some(c => c.id === msg.channel_id);
  if(!channelVisible) return;

  const activelyViewing = currentView === 'chat' && currentChannelId === msg.channel_id && document.hasFocus();
  if(activelyViewing){
    setLastRead(msg.channel_id, msg.created_at);
    return;
  }
  chatUnread[msg.channel_id] = (chatUnread[msg.channel_id] || 0) + 1;
  playNotificationSound();
  requestRealtimeUpdate('render'); // sidebar badge + nav badge both need a full render
}

// Pin/unpin and edits happen via UPDATE, and need to reach anyone with that
// channel open live, not just the person who made the change.
function handleMessageUpdateGlobal(payload){
  const msg = payload.new;
  if(!msg) return;
  const cache = messagesCache[msg.channel_id];
  if(cache){
    const idx = cache.findIndex(m=>m.id===msg.id);
    if(idx !== -1) cache[idx] = msg;
  }
  if(currentView === 'chat' && currentChannelId === msg.channel_id) refreshChatLight();
}

function handleMessageDeleteGlobal(payload){
  // DELETE events only reliably include the primary key (id), not the other
  // columns — so rather than assume we know which channel it belonged to,
  // just check every channel we've got cached and remove it wherever found.
  const deletedId = payload.old && payload.old.id;
  if(!deletedId) return;
  let affectedChannelId = null;
  Object.keys(messagesCache).forEach(chId=>{
    const idx = messagesCache[chId].findIndex(m=>m.id===deletedId);
    if(idx !== -1){ messagesCache[chId].splice(idx, 1); affectedChannelId = chId; }
  });
  delete messageReactions[deletedId];
  if(currentView === 'chat' && currentChannelId === affectedChannelId) refreshChatLight();
}

function handleReactionChange(payload){
  const row = payload.new || payload.old;
  if(!row) return;
  const messageId = row.message_id;
  // Only bother touching the local cache if we've actually loaded reactions
  // for this message at all — otherwise there's nothing to keep in sync yet.
  if(messageReactions[messageId] === undefined) return;
  if(payload.eventType === 'DELETE'){
    messageReactions[messageId] = messageReactions[messageId].filter(r=>r.id !== row.id);
  }else if(payload.eventType === 'INSERT'){
    if(!messageReactions[messageId].some(r=>r.id === row.id)) messageReactions[messageId].push(row);
  }
  // Only worth a redraw if that message is actually part of whatever's
  // currently on screen.
  const visible = (messagesCache[currentChannelId] || []).some(m=>m.id === messageId);
  if(currentView === 'chat' && visible) refreshChatLight();
}

function setupRealtimeSubscriptions(){
  if(realtimeChannelsActive) return;
  realtimeChannelsActive = true;
  supabaseClient
    .channel('kv_store_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kv_store' }, handleKvStoreChange)
    .subscribe();
  supabaseClient
    .channel('managers_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'managers' }, handleManagersChange)
    .subscribe();
  supabaseClient
    .channel('channels_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'channels' }, async ()=>{
      await loadChannels();
      subscribeAllVoicePresenceObservers();
      if(currentView === 'chat') requestRealtimeRefresh();
    })
    .subscribe();

  // Unread/notification tracking — every new message across every channel
  // you can see (RLS already limits this to your own DMs plus open
  // channels), not just the one you happen to have open.
  supabaseClient
    .channel('messages_unread_tracking')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, handleNewMessageForUnread)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, handleMessageUpdateGlobal)
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, handleMessageDeleteGlobal)
    .subscribe();

  // Reactions on any message you can currently see, and the shared sticker
  // library — both need to stay live across everyone using Team Chat.
  supabaseClient
    .channel('reactions_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'message_reactions' }, handleReactionChange)
    .subscribe();
  supabaseClient
    .channel('stickers_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'stickers' }, async ()=>{
      await loadStickers();
      if(currentView === 'chat' && composerPickerOpen === 'stickers') refreshChatLight();
    })
    .subscribe();

  // Online status — tracked the moment you're signed in, on any tab, not
  // just while viewing Team Chat.
  appPresenceChannel = supabaseClient.channel('app-presence', { config: { presence: { key: currentManagerId } } });
  appPresenceChannel
    .on('presence', { event: 'sync' }, ()=>{
      const state = appPresenceChannel.presenceState();
      onlineManagers = {};
      Object.keys(state).forEach(key=> onlineManagers[key] = true);
      // A light refresh, not a full render — someone else going online/offline
      // never needs to touch your own sidebar, and this fires often enough
      // (anyone opening/closing a tab) that a full rebuild was causing a
      // visible flash across the whole app for everyone connected.
      requestRealtimeUpdate('refresh');
    })
    .subscribe(async (status)=>{
      if(status === 'SUBSCRIBED'){
        try{ await appPresenceChannel.track({ online: true }); }catch(e){ console.error('presence track failed', e); }
      }
    });
}
function teardownRealtimeSubscriptions(){
  realtimeChannelsActive = false;
  if(appPresenceChannel){ appPresenceChannel.untrack().catch(()=>{}); appPresenceChannel = null; }
  onlineManagers = {};
  supabaseClient.removeAllChannels();
}

async function completeSignIn(userId){
  currentManagerId = userId;
  authenticated = true;
  loading = true;
  render();
  await ensureOwnManagerProfile();
  await loadManagersList();
  await warmAvatarUrlCache();
  const admin = managersList.find(m=>m.is_admin);
  await ensureSeedRoster(admin ? admin.user_id : userId);
  await migrateStatusCodesOnce();
  await migrateStatusCodesV2Once();
  await migrateCombineQarLogsOnce();
  await migrateToneOfVoiceLabelOnce();
  await migrateAutoDnmeOnce();
  await loadRoster();
  await loadChannels();
  setupRealtimeSubscriptions();
  loading = false;
  render();
}

async function signOut(){
  if(voiceChannelId) await leaveVoiceChannel();
  teardownRealtimeSubscriptions();
  await supabaseClient.auth.signOut();
  authenticated = false;
  currentManagerId = null;
  roster = [];
  attendanceCache = {};
  monthLoaded = {};
  managersList = [];
  currentView = 'today';
  channels = [];
  currentChannelId = null;
  messagesCache = {};
  chatMessagesSubscribed = null;
  chatMsgRTChannel = null;
  importReviewCache = null;
  voiceChannelOccupants = {};
  voiceObserverChannels = {};
  renderGate();
}

function wireAccessSettingsPanel(){
  const saveNameBtn = document.getElementById('saveMyName');
  if(saveNameBtn){
    saveNameBtn.addEventListener('click', async ()=>{
      const val = document.getElementById('myNameInput').value.trim();
      if(!val){ showToast('Name cannot be empty'); return; }
      const { error } = await supabaseClient.from('managers').update({ name: val }).eq('user_id', currentManagerId);
      if(error){ console.error('name update failed', error); showToast('Update failed — try again'); return; }
      showToast('Name updated');
      await loadManagersList();
      refresh();
    });
  }
  document.querySelectorAll('[data-toggle-admin]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const targetId = btn.dataset.toggleAdmin;
      const currentlyAdmin = btn.dataset.currently === 'true';
      const { error } = await supabaseClient.rpc('set_manager_admin', { target_user_id: targetId, new_is_admin: !currentlyAdmin });
      if(error){ showToast('Update failed — try again'); return; }
      showToast('Updated');
      await loadManagersList();
      refresh();
    });
  });
  document.querySelectorAll('[data-reset-pw]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const email = btn.dataset.resetPw;
      if(!confirm(`Send a password reset email to ${email}?`)) return;
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
      if(error){ console.error('reset email failed', error); showToast('Could not send reset email — try again'); return; }
      showToast(`Reset email sent to ${email}`);
    });
  });

  const savePwBtn = document.getElementById('saveMyPassword');
  if(savePwBtn){
    savePwBtn.addEventListener('click', async ()=>{
      const val = document.getElementById('myNewPassword').value;
      if(!val || val.length < 6){ showToast('Password needs to be at least 6 characters'); return; }
      const { error } = await supabaseClient.auth.updateUser({ password: val });
      if(error){ console.error('password update failed', error); showToast('Update failed — try again'); return; }
      showToast('Password updated');
      document.getElementById('myNewPassword').value = '';
    });
  }

  document.querySelectorAll('[data-set-pw]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const targetId = btn.dataset.setPw;
      const targetName = btn.dataset.setPwName;
      const newPassword = prompt(`Set a new password for ${targetName} (min 6 characters):`);

      if(newPassword.length < 6){ showToast('Password needs to be at least 6 characters'); return; }
      const { data, error } = await supabaseClient.functions.invoke('admin-actions', {
        body: { action: 'set_password', target_user_id: targetId, new_password: newPassword }
      });
      if(error || data?.error){ console.error('set password failed', error || data.error); showToast('Could not set password — check console'); return; }
      showToast(`Password updated for ${targetName}`);
    });
  });

  main.querySelectorAll('[data-view-img]').forEach(el=>{
    el.addEventListener('click', ()=> openImageModal(el.dataset.viewImg));
  });
  const changeMyAvatarBtn = document.getElementById('changeMyAvatar');
  if(changeMyAvatarBtn) changeMyAvatarBtn.addEventListener('click', ()=>{
    openAvatarCropModal(currentManagerId, refresh);
  });
  const removeMyAvatarBtn = document.getElementById('removeMyAvatar');
  if(removeMyAvatarBtn) removeMyAvatarBtn.addEventListener('click', async ()=>{
    const ok = await removeAvatar(currentManagerId);
    if(ok){ showToast('Profile picture removed'); refresh(); }
  });
  document.querySelectorAll('[data-admin-set-avatar]').forEach(btn=>{
    btn.addEventListener('click', ()=> openAvatarCropModal(btn.dataset.adminSetAvatar, refresh));
  });
  document.querySelectorAll('[data-admin-remove-avatar]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const ok = await removeAvatar(btn.dataset.adminRemoveAvatar);
      if(ok){ showToast('Profile picture removed'); refresh(); }
    });
  });

  const createBtn = document.getElementById('createMgrAccount');
  if(createBtn){
    createBtn.addEventListener('click', async ()=>{
      const name = document.getElementById('newMgrName').value.trim();
      const email = document.getElementById('newMgrEmail').value.trim();
      const password = document.getElementById('newMgrPassword').value;
      if(!name || !email || !password){ showToast('Fill in name, email, and password'); return; }
      if(password.length < 6){ showToast('Password needs to be at least 6 characters'); return; }
      const { data, error } = await supabaseClient.functions.invoke('admin-actions', {
        body: { action: 'create_user', email, password, name }
      });
      if(error || data?.error){ console.error('create user failed', error || data.error); showToast('Could not create account — check console'); return; }
      showToast(`Account created for ${name}`);
      await loadManagersList();
      refresh();
    });
  }
}

/* ================= Init ================= */
(async function init(){
  try{
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(session){
      await completeSignIn(session.user.id);
    }else{
      renderGate();
    }
    supabaseClient.auth.onAuthStateChange((event)=>{
      if(event === 'SIGNED_OUT'){ authenticated = false; currentManagerId = null; renderGate(); }
    });

    console.error('App failed to start', e);
    document.getElementById('app').innerHTML = `
      <div class="gate-wrap"><div class="gate-card">
        <div class="gate-brand">${NINJA_ICON_SVG}QA Ninjas</div>
        <div class="gate-sub">Something went wrong loading the app</div>
        <div class="gate-error">${escapeHtml(String(e && e.message ? e.message : e))}</div>
        <div class="hint">Open your browser's DevTools (F12) → Console for full details, or try reloading the page.</div>
      </div></div>
    `;
  }
})();
