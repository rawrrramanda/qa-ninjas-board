<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Ninjas — Interpreter Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
<style>
  :root{
    --bg-app:#F4F5F1;
    --bg-panel:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6672;
    --ink-faint:#94A0A0;
    --border:#E1E4DD;
    --sidebar-bg:#132029;
    --sidebar-ink:#D6E2E2;
    --sidebar-ink-dim:#7C9091;
    --accent:#2F7A8C;
    --accent-dark:#215A68;
    --accent-soft:#E4EEEF;
    --accent-warm:#E0793C;
    --status-present:#3F8F5F;
    --status-present-soft:#E5F2EA;
    --status-absent:#C24444;
    --status-absent-soft:#F8E9E9;
    --status-leave:#8A7EC8;
    --status-leave-soft:#EFEDF8;
    --status-late:#C98A26;
    --status-late-soft:#FBF0DD;
    --status-off:#8B9696;
    --status-off-soft:#EEF0EE;
    --radius:10px;
    --shadow:0 1px 2px rgba(20,30,30,0.06), 0 4px 16px rgba(20,30,30,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg-app);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:220px;
    flex-shrink:0;
    background:var(--sidebar-bg);
    color:var(--sidebar-ink);
    display:flex;
    flex-direction:column;
    padding:24px 16px;
  }
  .brand{padding:0 8px 24px 8px;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:18px;}
  .brand-mark{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.02em;
    color:#fff;
    display:flex;align-items:center;gap:8px;
  }
  .brand-mark .dot{width:9px;height:9px;border-radius:50%;background:var(--accent-warm);box-shadow:0 0 0 3px rgba(224,121,60,0.25);flex-shrink:0;}
  .brand-sub{font-size:11.5px;color:var(--sidebar-ink-dim);margin-top:4px;letter-spacing:0.03em;text-transform:uppercase;}
  nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 10px;border-radius:8px;
    font-size:14px;font-weight:500;cursor:pointer;
    color:var(--sidebar-ink-dim);
    transition:background .15s, color .15s;
    border:none;background:none;text-align:left;width:100%;
    font-family:inherit;
  }
  .nav-item:hover{background:rgba(255,255,255,0.06);color:var(--sidebar-ink);}
  .nav-item.active{background:rgba(47,122,140,0.35);color:#fff;}
  .nav-item .ic{width:16px;text-align:center;font-size:14px;opacity:0.9;}
  .sidebar-foot{
    margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,0.08);
    font-size:11px;color:var(--sidebar-ink-dim);line-height:1.5;
  }

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;padding:28px 36px 60px;}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;}
  .page-title .sub{display:block;font-family:'Inter';font-size:13px;font-weight:400;color:var(--ink-soft);margin-top:3px;}

  .btn{
    font-family:'Inter';font-size:13.5px;font-weight:600;
    padding:9px 14px;border-radius:8px;border:1px solid var(--border);
    background:var(--bg-panel);color:var(--ink);cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    transition:border-color .15s, background .15s;
  }
  .btn:hover{border-color:var(--accent);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--accent-soft);}
  .btn-danger{color:var(--status-absent);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-sm{padding:6px 10px;font-size:12.5px;}

  .date-nav{display:flex;align-items:center;gap:6px;}
  .date-nav input[type=date], .date-nav input[type=month]{
    font-family:'IBM Plex Mono';font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-panel);color:var(--ink);
  }

  .stat-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .stat-chip{
    background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px 16px;min-width:86px;box-shadow:var(--shadow);
  }
  .stat-chip .n{font-family:'IBM Plex Mono';font-size:20px;font-weight:500;}
  .stat-chip .l{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin-top:2px;}

  .panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}

  table{width:100%;border-collapse:collapse;}
  th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;
    color:var(--ink-soft);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--border);
    background:#FAFAF8;
  }
  td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13.5px;}
  tr:last-child td{border-bottom:none;}
  .interp-name{font-weight:600;}
  .interp-role{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}

  .status-pills{display:flex;gap:5px;flex-wrap:wrap;}
  .pill{
    font-family:'IBM Plex Mono';font-size:11.5px;font-weight:500;
    padding:5px 9px;border-radius:20px;border:1.5px solid var(--border);
    background:#fff;color:var(--ink-soft);cursor:pointer;transition:all .12s;
  }
  .pill:hover{border-color:var(--accent);}
  .pill.sel-P{background:var(--status-present-soft);border-color:var(--status-present);color:var(--status-present);}
  .pill.sel-A{background:var(--status-absent-soft);border-color:var(--status-absent);color:var(--status-absent);}
  .pill.sel-U{background:var(--status-leave-soft);border-color:var(--status-leave);color:var(--status-leave);}
  .pill.sel-N{background:var(--status-late-soft);border-color:var(--status-late);color:var(--status-late);}
  .pill.sel-O{background:var(--status-off-soft);border-color:var(--status-off);color:var(--status-off);}

  .upload-cell{display:flex;align-items:flex-start;gap:8px;}
  .thumb{
    width:38px;height:38px;border-radius:6px;object-fit:cover;cursor:pointer;
    border:1px solid var(--border);flex-shrink:0;background:#f2f2f0;
  }
  .thumb-empty{
    width:38px;height:38px;border-radius:6px;border:1.5px dashed var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:15px;flex-shrink:0;
  }
  .upload-actions{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
  .upload-label{
    display:inline-flex;align-items:center;
    font-family:inherit;font-size:11.5px;color:var(--accent);cursor:pointer;font-weight:600;
    padding:6px 9px;border-radius:6px;border:1px solid var(--accent-soft);background:var(--accent-soft);
    line-height:1.2;margin:0;appearance:none;-webkit-appearance:none;
  }
  .upload-label:hover{background:#d7e8ea;}
  .upload-label input{display:none;}
  .note-input{
    width:100%;min-width:110px;border:1px solid transparent;background:transparent;
    font-family:inherit;font-size:13px;padding:6px 8px;border-radius:6px;color:var(--ink);
  }
  .note-input:hover, .note-input:focus{border-color:var(--border);background:#fafaf8;outline:none;}

  .empty-state{padding:60px 30px;text-align:center;color:var(--ink-soft);}
  .empty-state .big{font-family:'Space Grotesk';font-size:16px;color:var(--ink);margin-bottom:6px;}

  /* ---------- Roster ---------- */
  .roster-form{display:flex;gap:8px;padding:16px;border-bottom:1px solid var(--border);background:#FAFAF8;flex-wrap:wrap;}
  .roster-form input[type=text], .roster-form select{
    font-family:inherit;font-size:13.5px;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:#fff;
  }
  .roster-form input[name=name]{flex:1;min-width:150px;}
  .roster-form input[name=language]{width:120px;}
  .roster-form input[name=shift]{width:100px;}
  .roster-form select[name=type]{width:110px;}
  .roster-form input[name=offDays]{width:120px;}

  .bulk-toggle{padding:12px 16px;font-size:12.5px;color:var(--accent);cursor:pointer;font-weight:600;border-bottom:1px solid var(--border);background:#FAFAF8;}
  .bulk-panel{padding:16px;border-bottom:1px solid var(--border);background:#FAFAF8;display:none;}
  .bulk-panel.open{display:block;}
  .bulk-panel label{font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;display:block;margin-bottom:5px;}
  .bulk-panel .row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
  .bulk-panel .col{flex:1;min-width:240px;}
  .bulk-panel textarea{
    width:100%;min-height:110px;font-family:'IBM Plex Mono';font-size:11.5px;padding:9px 11px;
    border-radius:8px;border:1px solid var(--border);background:#fff;resize:vertical;
  }
  .bulk-panel .hint{font-size:11px;color:var(--ink-faint);margin-top:4px;line-height:1.5;}
  .toggle{position:relative;width:36px;height:20px;flex-shrink:0;}
  .toggle input{opacity:0;width:0;height:0;}
  .toggle .track{position:absolute;inset:0;background:var(--border);border-radius:20px;transition:.15s;cursor:pointer;}
  .toggle .track:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,0.2);}
  .toggle input:checked + .track{background:var(--status-present);}
  .toggle input:checked + .track:before{transform:translateX(16px);}

  /* ---------- Overview ---------- */
  .month-summary td{font-family:'IBM Plex Mono';font-size:12.5px;overflow-wrap:anywhere;}
  .month-summary td:first-child{font-family:'Inter';font-size:13.5px;}
  .month-summary th{overflow-wrap:break-word;}
  .summary-scroll{overflow-x:auto;}
  .violation-summary{table-layout:fixed;min-width:760px;}
  .violation-summary td:first-child, .violation-summary th:first-child{width:150px;}
  .violation-summary th:nth-child(2), .violation-summary th:nth-child(3){width:90px;}
  .pct-bar{width:70px;height:6px;border-radius:3px;background:var(--border);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px;}
  .pct-bar > span{display:block;height:100%;background:var(--accent);}

  .board-wrap{overflow-x:auto;padding:6px 0;}
  .board{border-collapse:separate;border-spacing:3px;}
  .board th{background:none;border:none;padding:2px 4px;font-size:10px;color:var(--ink-faint);text-align:center;}
  .board td{border:none;padding:0;}
  .board .row-name{font-size:12px;font-weight:600;text-align:left;padding-right:10px;white-space:nowrap;}
  .cell{
    width:16px;height:16px;border-radius:4px;background:var(--status-off-soft);
    display:inline-block;
  }
  .cell.st-P{background:var(--status-present);}
  .cell.st-A{background:var(--status-absent);}
  .cell.st-U{background:var(--status-leave);}
  .cell.st-N{background:var(--status-late);}
  .cell.st-O{background:#DDE1DE;}
  .cell.st-none{background:#F1F2EF;border:1px dashed #DDD;}

  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(19,32,41,0.72);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:30px;
  }
  .modal-img{max-width:90vw;max-height:85vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
  .modal-close{position:absolute;top:22px;right:28px;color:#fff;font-size:26px;cursor:pointer;background:none;border:none;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:20px;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:200;
  }
  .toast.show{opacity:0.94;}

  .spinner-line{font-family:'IBM Plex Mono';font-size:12.5px;color:var(--ink-soft);padding:30px;text-align:center;}

  /* ---------- Gate ---------- */
  .gate-wrap{
    min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;
    background:var(--sidebar-bg);
  }
  .gate-card{
    background:var(--bg-panel);border-radius:14px;padding:36px 34px;width:340px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);text-align:center;
  }
  .gate-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px;}
  .gate-brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent-warm);flex-shrink:0;}
  .gate-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:22px;}
  .gate-card input{
    width:100%;text-align:center;letter-spacing:0.1em;font-family:'IBM Plex Mono';font-size:16px;
    padding:12px;border-radius:8px;border:1.5px solid var(--border);margin-bottom:12px;
  }
  .gate-card input:focus{outline:none;border-color:var(--accent);}
  .gate-card .btn{width:100%;justify-content:center;padding:11px;}
  .gate-error{color:var(--status-absent);font-size:12px;margin-bottom:10px;min-height:14px;}

  .settings-panel{padding:16px;border-top:1px solid var(--border);background:#FAFAF8;}
  .settings-panel label{font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;display:block;margin-bottom:6px;}
  .settings-panel .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .settings-panel input[type=text]{font-family:'IBM Plex Mono';font-size:13px;padding:9px 11px;border-radius:8px;border:1px solid var(--border);width:200px;}

  /* ---------- Performance ---------- */
  .sev-badge{font-family:'IBM Plex Mono';font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-block;}
  .item-pill{
    display:inline-block;font-family:'IBM Plex Mono';font-size:11px;font-weight:500;
    padding:3px 8px;border-radius:6px;background:var(--status-absent-soft);color:var(--status-absent);
    margin:2px 3px 2px 0;overflow-wrap:anywhere;max-width:100%;
  }

  /* ---------- Team Chat ---------- */
  .chat-wrap{display:flex;height:calc(100vh - 130px);min-height:480px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-panel);overflow:hidden;}
  .chat-channels{width:210px;flex-shrink:0;background:#FAFAF8;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;}
  .chat-channels-group{padding:14px 12px 4px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-faint);}
  .chat-channel-btn{
    display:flex;align-items:center;gap:6px;width:calc(100% - 16px);margin:1px 8px;padding:7px 8px;border-radius:6px;
    border:none;background:none;text-align:left;font-size:13px;color:var(--ink-soft);cursor:pointer;font-family:inherit;
  }
  .chat-channel-btn:hover{background:var(--accent-soft);}
  .chat-channel-btn.active{background:var(--accent);color:#fff;font-weight:600;}
  .chat-channel-btn .voice-count{margin-left:auto;font-family:'IBM Plex Mono';font-size:10.5px;opacity:0.8;}
  .chat-mini-avatar{width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;flex-shrink:0;}
  .chat-new-channel{padding:10px 12px;border-top:1px solid var(--border);margin-top:auto;}
  .chat-main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .chat-header{padding:14px 18px;border-bottom:1px solid var(--border);font-family:'Space Grotesk';font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:space-between;}
  .chat-messages{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:2px;}
  .chat-msg{display:flex;gap:10px;padding:6px 0;}
  .chat-msg-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
  .chat-msg-name{font-weight:600;font-size:13px;}
  .chat-msg-time{font-size:10.5px;color:var(--ink-faint);margin-left:7px;font-family:'IBM Plex Mono';}
  .chat-msg-body{font-size:13.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px;}
  .chat-msg-attach{margin-top:6px;}
  .chat-msg-attach img{max-width:260px;max-height:220px;border-radius:8px;border:1px solid var(--border);cursor:pointer;}
  .chat-msg-file{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:8px;border:1px solid var(--border);background:#FAFAF8;font-size:12.5px;color:var(--accent);text-decoration:none;}
  .chat-composer{border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:8px;align-items:flex-end;}
  .chat-composer textarea{flex:1;resize:none;min-height:38px;max-height:120px;font-family:inherit;font-size:13.5px;padding:9px 11px;border-radius:8px;border:1px solid var(--border);}
  .chat-attach-btn{flex-shrink:0;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:15px;}
  .voice-room{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;}
  .voice-participants{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  .voice-avatar{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .voice-avatar .circle{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;border:3px solid transparent;}
  .voice-avatar.speaking .circle{border-color:var(--status-present);}
  .voice-avatar .vname{font-size:12px;font-weight:600;}
  .voice-controls{display:flex;gap:10px;}
  .sev-PME{background:var(--status-late-soft);color:var(--status-late);}
  .sev-DNME{background:var(--status-absent-soft);color:var(--status-absent);}
  .sev-NA{background:var(--status-off-soft);color:var(--status-off);}
  .violation-form{display:flex;gap:8px;padding:16px;border-bottom:1px solid var(--border);background:#FAFAF8;flex-wrap:wrap;align-items:flex-start;}
  .violation-form select, .violation-form input[type=text], .violation-form input[type=date], .violation-form textarea{
    font-family:inherit;font-size:13.5px;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:#fff;
  }
  .violation-form select[name=interp]{width:170px;}
  .violation-form select[name=category]{width:220px;}
  .violation-form select[name=item]{width:220px;}
  .violation-form select[name=severity]{width:120px;}
  .violation-form input[name=vdate]{width:150px;}
  .violation-form textarea[name=note]{flex:1;min-width:200px;min-height:40px;resize:vertical;}
  .violation-form input[name=qar]{width:150px;font-family:'IBM Plex Mono';}
  .cat-tag{font-size:11px;color:var(--ink-soft);}
  .item-tag{font-weight:600;}
  .qar-tag{font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);}

  .flag-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;width:100%;margin-top:2px;}
  .flag-group{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:#fff;}
  .flag-group-title{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);margin-bottom:6px;overflow-wrap:anywhere;}
  .flag-item{display:flex;align-items:center;gap:7px;font-size:13px;padding:5px 0;cursor:pointer;}
  .flag-item input[type=checkbox]{flex-shrink:0;width:15px;height:15px;cursor:pointer;}
  .flag-item span{flex:1;overflow-wrap:anywhere;}
  .flag-sev-select{font-family:'IBM Plex Mono';font-size:10.5px;padding:3px 5px;border-radius:6px;border:1px solid var(--border);flex-shrink:0;}

  @media (max-width:820px){
    #app{flex-direction:column;}

/* ================= Storage helpers =================

async function storageGet(key){
  try{
    const { data, error } = await supabaseClient.from('kv_store').select('value').eq('key', key).maybeSingle();
    if(error){ console.error('storage get failed for', key, error); return null; }
    if(!data) return null;

  }catch(e){ console.error('storage get threw for', key, e); return null; }
}
async function storageSet(key, value){
  try{

      .upsert({ key, value, updated_at: new Date().toISOString() }, { onConflict: 'key' });

// a URL). We deliberately don't store a permanent public URL — screenshots are
// only viewable through short-lived signed URLs generated on demand, so a
// leaked/logged URL can't be used to view the image indefinitely.
async function uploadScreenshot(blob, pathHint){
  try{
    const path = `${pathHint}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
    const { error } = await supabaseClient.storage.from(SCREENSHOTS_BUCKET).upload(path, blob, {

    });

    return path;
  }catch(e){ console.error('upload failed', e); return null; }
}

// Handles both old-format stored values (full public URLs, from before the
// bucket was made private) and new-format ones (bare paths), so existing
// screenshots keep working without needing a one-time data migration.
function pathFromStoredValue(value){
  if(!value) return null;
  const marker = `/${SCREENSHOTS_BUCKET}/`;
  const idx = value.indexOf(marker);
  if(idx === -1) return value; // already a bare path
  return decodeURIComponent(value.slice(idx + marker.length).split('?')[0]);
}

const SIGNED_URL_TTL = 3600; // 1 hour — regenerated fresh on every page load/refresh
async function getSignedUrl(path){
  if(!path) return null;
  try{
    const { data, error } = await supabaseClient.storage.from(SCREENSHOTS_BUCKET).createSignedUrl(path, SIGNED_URL_TTL);
    if(error){ console.error('signed url failed', error); return null; }
    return data?.signedUrl || null;
  }catch(e){ console.error('signed url failed', e); return null; }
}

  const paths = [...new Set(storedValues.map(pathFromStoredValue).filter(Boolean))];
  const map = {};
  await Promise.all(paths.map(async p=>{ map[p] = await getSignedUrl(p); }));

}

/* ================= Image compression ================= */
function compressFile(file, maxWidth, quality){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > maxWidth){ h = Math.round(h * maxWidth / w); w = maxWidth; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=>{
        if(blob) resolve(blob); else reject(new Error('toBlob failed'));
      }, 'image/jpeg', quality);
    };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}
async function compressForStorage(file){
  // Real file storage (not a JSON field), so this is about reasonable load times,
  // not squeezing under a text-size ceiling — a bit more headroom than before.
  let out = await compressFile(file, 900, 0.72);
  if(out.size > 900000){
    out = await compressFile(file, 640, 0.65);
  }
  if(out.size > 900000){
    out = await compressFile(file, 480, 0.55);
  }
  return out;
}

// RFC4180-ish CSV parser — handles quoted fields with embedded commas,
// newlines, and "" escaped quotes, which the QA export relies on heavily.
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false, i = 0;
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM
  while(i < text.length){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    }else{
      if(c === '"'){ inQuotes = true; i++; continue; }
      if(c === ','){ row.push(field); field = ''; i++; continue; }
      if(c === '\r'){ i++; continue; }
      if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += c; i++; continue;
    }
  }
  if(field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
  return rows;
}

// Strips HTML tags/entities from a QA note field down to clean plain text.
function stripHtmlNote(html){
  const div = document.createElement('div');
  div.innerHTML = html
    .replace(/<\/p>/gi, '\n')
    .replace(/<br\s*\/?>/gi, '\n');
  const text = div.textContent || '';
  return text.replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}

// CSV export uses M/D/YY (e.g. "8/3/26"); convert to YYYY-MM-DD.
function parseCsvDate(s){
  const parts = (s||'').split('/').map(x=>x.trim());
  if(parts.length !== 3) return null;
  const [m,d,y] = parts;
  const yyyy = y.length === 2 ? '20'+y : y;
  return `${yyyy}-${pad(Number(m))}-${pad(Number(d))}`;
}

function csvSeverity(status){
  if(status === 'Partially meets expectations') return 'PME';
  if(status === 'Does not meet expectations') return 'DNME';
  return '';
}

// Two item-sets are "the same" if they contain the same {item, severity}
// pairs, regardless of order — used to detect whether an existing log matches
// what the CSV says should be flagged.
function itemSetsMatch(a, b){
  if(a.length !== b.length) return false;
  const norm = arr => arr.map(x=>`${x.item}::${x.severity||''}`).sort();
  const na = norm(a), nb = norm(b);
  return na.every((v,i)=> v === nb[i]);
}

// Processes an uploaded CSV: matches each row's interpreter and manager,
// checks existing logs for that QAR, and either confirms a match, flags a
// mismatch for manual review, auto-creates a missing log, or queues unmatched
// names for review. Never overwrites an existing log automatically.
async function processImportedCsv(csvText){
  const rows = parseCSV(csvText);
  if(rows.length < 2) return { error: 'CSV appears to be empty.' };
  const header = rows[0];
  const idx = name => header.indexOf(name);
  const need = ['Agent Name','Owner Name','QA','Interpretation date'];
  for(const col of need){
    if(idx(col) === -1) return { error: `Missing expected column: "${col}". Is this the right file?` };
  }

  await loadImportReview();
  const activeRoster = roster; // match against full roster (active + inactive), not just active
  const summary = { skippedClean: 0, alreadyMatched: 0, autoLogged: 0, mismatched: 0, unmatchedInterpreter: 0, unmatchedManager: 0, errors: 0 };

  for(let r=1; r<rows.length; r++){
    const row = rows[r];
    if(row.length < header.length) continue; // skip malformed/blank trailing rows
    const agentName = (row[idx('Agent Name')]||'').trim();
    const ownerNameRaw = (row[idx('Owner Name')]||'').trim();
    const qar = (row[idx('QA')]||'').trim();
    const date = parseCsvDate(row[idx('Interpretation date')]);
    if(!agentName || !qar || !date){ summary.errors++; continue; }

    const items = [];
    CSV_COLUMN_MAP.forEach(m=>{
      const status = (row[idx(m.col)]||'').trim();
      if(status && status !== 'Meets expectations'){
        let severity = csvSeverity(status);
        const def = catalogItem(m.category, m.item);
        if(!def || !def.severity) severity = ''; // exempt items: drop severity regardless of CSV
        items.push({ category: m.category, item: m.item, severity });
      }
    });
    if(items.length === 0){ summary.skippedClean++; continue; }

    const note = CSV_NOTE_COLUMNS.map(col => row[idx(col)]).filter(v=>v && v.trim()).map(stripHtmlNote).join('\n\n');

    const interp = activeRoster.find(p=> normalizeName(p.name) === normalizeName(agentName));
    const mappedManagerName = OWNER_NAME_MAP_NORMALIZED[normalizeName(ownerNameRaw)] || null;
    const managerRec = mappedManagerName ? managersList.find(m=> normalizeName(m.name) === normalizeName(mappedManagerName)) : null;

    if(!interp){
      queueReviewItem({ type:'unmatched-interpreter', qar, date, agentName, ownerNameRaw, items, note });
      summary.unmatchedInterpreter++;
      continue;
    }
    if(!managerRec){
      queueReviewItem({ type:'unmatched-manager', qar, date, agentName, ownerNameRaw, interpreterId: interp.id, items, note });
      summary.unmatchedManager++;
      continue;
    }

    await ensureViolationsLoaded(interp.id);
    const existing = (violationsCache[interp.id]||[]).find(v=> v.qar && v.qar.trim() === qar);

    if(existing){
      if(itemSetsMatch(existing.items||[], items)){
        summary.alreadyMatched++;
      }else{
        queueReviewItem({ type:'mismatch', qar, date, agentName, ownerNameRaw, interpreterId: interp.id, items, note, existingItems: existing.items||[] });
        summary.mismatched++;
      }
      continue;
    }

    violationsCache[interp.id].push({
      id: uid(), date, qar, note, items,
      loggedBy: managerRec.user_id, createdAt: new Date().toISOString(),
      autoImported: true
    });
    await saveViolations(interp.id);
    summary.autoLogged++;
  }

  await saveImportReview();
  return { summary };
}

function queueReviewItem(item){
  // avoid duplicate queue entries across repeated imports of overlapping data
  const exists = importReviewCache.some(r => r.qar === item.qar && r.type === item.type);
  if(exists) return;
  importReviewCache.push({ id: uid(), createdAt: new Date().toISOString(), ...item });
}

/* ================= Bulk import ================= */
function parseBulkPool(text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    let parts = line.split('\t').map(s=>s.trim());
    if(parts.length < 2){
      parts = line.split(/\s{2,}/).map(s=>s.trim()).filter(Boolean);
    }
    const [name, language, shift, type, offDays] = parts;
    return {name, language: language||'', shift: shift||'', type: type||'', offDays: offDays||''};
  }).filter(r=>r.name);
}
function parseActiveNames(text){
  return new Set(text.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.toLowerCase()));
}
async function importRoster(){
  const poolText = document.getElementById('bulkPool').value;
  const activeText = document.getElementById('bulkActive').value;
  if(!poolText.trim()){ showToast('Paste your interpreter pool first'); return; }
  const pool = parseBulkPool(poolText);
  const activeSet = parseActiveNames(activeText);
  pool.forEach(entry=>{
    const existing = roster.find(p=>p.name.toLowerCase() === entry.name.toLowerCase());
    if(existing){
      existing.language = entry.language;
      existing.shift = entry.shift;
      existing.type = entry.type;
      existing.offDays = entry.offDays;
      existing.active = activeSet.has(entry.name.toLowerCase());
    }else{
      roster.push({id: uid(), name: entry.name, language: entry.language, shift: entry.shift, type: entry.type, offDays: entry.offDays, managerId: currentManagerId, active: activeSet.has(entry.name.toLowerCase())});
    }
  });
  const ok = await storageSet('roster', roster);
  showToast(ok ? 'Roster imported' : 'Import failed — try again');
  if(ok) refresh();
}

// One-time fix for every already-stored attendance record, run once per board
// (tracked via a marker key so repeat logins skip it instantly). Rewrites the
// old "Leave" code ('L') to the new "Unsure" code ('U'), and the old "Late"
// code ('T') to its new code ('L') — done in a single pass per record, based
// on each entry's original stored value, so the two renames can't collide
// with each other even though 'L' briefly meant something else.
async function migrateStatusCodesOnce(){
  const done = await storageGet('migration:status-codes-v1');
  if(done) return;
  try{
    const { data, error } = await supabaseClient.from('kv_store').select('key,value').like('key', 'attendance:%');
    if(error){ console.error('status code migration scan failed', error); return; }
    for(const row of (data || [])){
      const day = row.value || {};
      let changed = false;
      Object.values(day).forEach(entry=>{
        if(!entry || !entry.status) return;
        if(entry.status === 'L'){ entry.status = 'U'; changed = true; }
        else if(entry.status === 'T'){ entry.status = 'L'; changed = true; }
      });
      if(changed){
        await storageSet(row.key, day);
        if(attendanceCache[row.key.replace('attendance:','')] !== undefined){
          attendanceCache[row.key.replace('attendance:','')] = day;
        }
      }
    }
    await storageSet('migration:status-codes-v1', true);
  }catch(e){ console.error('status code migration failed', e); }
}

// v2: renames "Late" from code 'L' to code 'N' ("Nonadherence"). Separate,
// versioned migration so it runs exactly once regardless of whether v1 has
// already run on this board.
async function migrateStatusCodesV2Once(){
  const done = await storageGet('migration:status-codes-v2');
  if(done) return;
  try{
    const { data, error } = await supabaseClient.from('kv_store').select('key,value').like('key', 'attendance:%');
    if(error){ console.error('status code v2 migration scan failed', error); return; }
    for(const row of (data || [])){
      const day = row.value || {};
      let changed = false;
      Object.values(day).forEach(entry=>{
        if(entry && entry.status === 'L'){ entry.status = 'N'; changed = true; }
      });
      if(changed){
        await storageSet(row.key, day);
        if(attendanceCache[row.key.replace('attendance:','')] !== undefined){
          attendanceCache[row.key.replace('attendance:','')] = day;
        }
      }
    }
    await storageSet('migration:status-codes-v2', true);
  }catch(e){ console.error('status code v2 migration failed', e); }
}

/* ---- Violations: one key per interpreter holding their full history ---- */
let violationsCache = {};   // { interpreterId: [ {id, date, qar, note, items:[{category,item,severity}], loggedBy, createdAt} ] }

// One-time migration: the violation record shape changed from "one record per
// flagged item" to "one record per QAR submission, holding an items array".
// This combines any existing legacy records (which have .category/.item
// directly, no .items array) that share the same QAR ID for the same
// interpreter into a single combined record — matching how new submissions
// already behave. Records with no QAR ID are wrapped individually rather than
// merged, since there's no shared identity to group them by.
async function migrateCombineQarLogsOnce(){
  const done = await storageGet('migration:combine-qar-v1');
  if(done) return;
  try{
    const { data, error } = await supabaseClient.from('kv_store').select('key,value').like('key', 'violations:%');
    if(error){ console.error('combine-qar migration scan failed', error); return; }
    for(const row of (data || [])){
      const records = Array.isArray(row.value) ? row.value : [];
      if(records.length === 0) continue;

      const alreadyCombined = records.filter(r => r && Array.isArray(r.items));
      const legacy = records.filter(r => r && !Array.isArray(r.items) && r.category);
      if(legacy.length === 0) continue; // nothing to migrate for this interpreter

      const groups = {};
      const solo = [];
      legacy.forEach(r=>{
        if(r.qar && r.qar.trim()){
          const key = r.qar.trim();
          (groups[key] = groups[key] || []).push(r);
        }else{
          solo.push(r);
        }
      });

      const merged = [];
      Object.values(groups).forEach(group=>{
        group.sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||''));
        const first = group[0];
        const items = group.map(r=>({ category: r.category, item: r.item, severity: r.severity || '' }));
        const notes = [...new Set(group.map(r=>r.note).filter(Boolean))];
        merged.push({
          id: first.id, date: first.date, qar: first.qar,
          note: notes.join(' | '),
          items,
          loggedBy: first.loggedBy, createdAt: first.createdAt
        });
      });
      solo.forEach(r=>{
        merged.push({
          id: r.id, date: r.date, qar: r.qar || '', note: r.note || '',
          items: [{ category: r.category, item: r.item, severity: r.severity || '' }],
          loggedBy: r.loggedBy, createdAt: r.createdAt
        });
      });

      const finalRecords = [...alreadyCombined, ...merged];
      await storageSet(row.key, finalRecords);
      const interpId = row.key.replace('violations:','');
      if(violationsCache[interpId] !== undefined) violationsCache[interpId] = finalRecords;
    }
    await storageSet('migration:combine-qar-v1', true);
  }catch(e){ console.error('combine-qar migration failed', e); }
}

// Renames "Call Etiquette – Professional Voice" to "Call Etiquette – Tone of
// Voice" in every already-stored violation record's items array, matching
// the catalog rename above so historical data still displays/edits correctly.
async function migrateToneOfVoiceLabelOnce(){
  const done = await storageGet('migration:tone-of-voice-v1');
  if(done) return;
  try{
    const { data, error } = await supabaseClient.from('kv_store').select('key,value').like('key', 'violations:%');
    if(error){ console.error('tone-of-voice migration scan failed', error); return; }
    const OLD_LABEL = 'Call Etiquette – Professional Voice';
    const NEW_LABEL = 'Call Etiquette – Tone of Voice';
    for(const row of (data || [])){
      const records = Array.isArray(row.value) ? row.value : [];
      let changed = false;
      records.forEach(rec=>{
        (rec.items || []).forEach(it=>{
          if(it.item === OLD_LABEL){ it.item = NEW_LABEL; changed = true; }
        });
      });
      if(changed){
        await storageSet(row.key, records);
        const interpId = row.key.replace('violations:','');
        if(violationsCache[interpId] !== undefined) violationsCache[interpId] = records;
      }
    }
    await storageSet('migration:tone-of-voice-v1', true);
  }catch(e){ console.error('tone-of-voice migration failed', e); }
}

function setField(dateStr, interpreterId, field, value){
  if(!attendanceCache[dateStr]) attendanceCache[dateStr] = {};
  if(!attendanceCache[dateStr][interpreterId]) attendanceCache[dateStr][interpreterId] = {};
  attendanceCache[dateStr][interpreterId][field] = value;
}

function shiftDate(dateStr, delta){
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + delta);
  return `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth()+1)}-${pad(dt.getUTCDate())}`;
}

    </div>
    <div id="overviewBody"><div class="spinner-line">Loading month…</div></div>

  document.querySelectorAll('[data-filter]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ viewFilter = btn.dataset.filter; refresh(); });
  });

  await ensureMonthLoaded(currentMonth);

  const n = daysInMonth(currentMonth);
  const todayYm = todayStr().slice(0,7);
  const lastDay = (currentMonth === todayYm) ? Number(todayStr().slice(8,10)) : n;

  const rosterInScope = viewFilter === 'mine' ? roster.filter(p=>p.managerId === currentManagerId) : roster;

  // gather ids: roster (in scope) + any id seen in data this month that's in scope
  const idSet = new Set(rosterInScope.map(p=>p.id));
  if(viewFilter === 'all'){
    for(let d=1; d<=lastDay; d++){
      const ds = currentMonth + '-' + pad(d);
      const day = attendanceCache[ds] || {};
      Object.keys(day).forEach(id=>idSet.add(id));
    }
  }
  const nameOf = id => (roster.find(p=>p.id===id)?.name) || '(removed)';
  const ids = [...idSet].sort((a,b)=> nameOf(a).localeCompare(nameOf(b)));

  const stats = {};
  ids.forEach(id=> stats[id] = {P:0,A:0,U:0,N:0,O:0,total:0});
  for(let d=1; d<=lastDay; d++){
    const ds = currentMonth + '-' + pad(d);
    const day = attendanceCache[ds] || {};
    ids.forEach(id=>{
      const s = day[id]?.status;

  }

  const body = document.getElementById('overviewBody');
  if(ids.length === 0){
    body.innerHTML = `<div class="panel"><div class="empty-state"><div class="big">Nothing logged yet</div><div>${viewFilter==='mine' ? 'No interpreters assigned to you, or nothing recorded for this month.' : 'No attendance recorded for this month.'}</div></div></div>`;
    return;
  }

  body.innerHTML = `
    <div class="panel" style="margin-bottom:22px;">
      <div class="summary-scroll">
      <table class="month-summary">
        <thead><tr>
          <th>Interpreter</th><th>Present</th><th>Absent</th><th>Unsure</th><th>Nonadherence</th><th>Off</th><th>Attendance rate</th>
        </tr></thead>
        <tbody>
          ${ids.map(id=>{
            const s = stats[id];
            const scheduled = s.total - s.O;
            const rate = scheduled > 0 ? Math.round(((s.P + s.N) / scheduled) * 100) : 0;
            return `<tr>
              <td>${escapeHtml(nameOf(id))}</td>
              <td>${s.P}</td><td>${s.A}</td><td>${s.U}</td><td>${s.N}</td><td>${s.O}</td>
              <td><span class="pct-bar"><span style="width:${rate}%"></span></span>${rate}%</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>

    <div class="panel" style="padding:18px 20px;">
      <div style="font-family:'Space Grotesk';font-size:14px;font-weight:600;margin-bottom:10px;">Day-by-day board</div>
      <div class="board-wrap">
        <table class="board">
          <thead><tr><th></th>${Array.from({length:lastDay},(_,i)=>`<th>${i+1}</th>`).join('')}</tr></thead>
          <tbody>
            ${ids.map(id=>{
              let cells = '';
              for(let d=1; d<=lastDay; d++){
                const ds = currentMonth + '-' + pad(d);
                const s = (attendanceCache[ds]||{})[id]?.status;
                cells += `<td><span class="cell ${s ? 'st-'+s : 'st-none'}" title="${s ? STATUS_MAP[s].label : 'No entry'} — Day ${d}"></span></td>`;
              }
              return `<tr><td class="row-name">${escapeHtml(nameOf(id))}</td>${cells}</tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div class="legend">
        ${STATUSES.map(s=>`<span><i class="cell st-${s.code}" style="display:inline-block;width:10px;height:10px;"></i>${s.label}</span>`).join('')}
        <span><i class="cell st-none" style="display:inline-block;width:10px;height:10px;"></i>No entry</span>
      </div>
    </div>

    ${await renderPerformanceOverviewPanel(ids)}
  `;
}

// Builds the "Performance overview" panel for Monthly Overview: total flags
// this month, a top-4 flagged-violation chart, and per-interpreter flag counts.
async function renderPerformanceOverviewPanel(ids){
  await ensureViolationsLoadedFor(ids);
  const nameOf = id => (roster.find(p=>p.id===id)?.name) || '(removed)';

  let totalFlags = 0, pmeCount = 0, dnmeCount = 0, plainCount = 0;
  const itemCounts = {};
  const perInterpreter = {};
  ids.forEach(id=>{
    const monthRecords = (violationsCache[id]||[]).filter(v=>v.date.slice(0,7)===currentMonth);
    let count = 0;
    monthRecords.forEach(v=>{
      (v.items||[]).forEach(it=>{
        totalFlags++;
        count++;
        if(it.severity==='PME') pmeCount++;
        else if(it.severity==='DNME') dnmeCount++;
        else plainCount++;
        itemCounts[it.item] = (itemCounts[it.item]||0) + 1;
      });
    });
    perInterpreter[id] = count;
  });

  const topItems = Object.entries(itemCounts).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const maxTop = topItems.length ? topItems[0][1] : 0;
  const topInterpreters = ids.map(id=>({id, count: perInterpreter[id]})).sort((a,b)=>b.count-a.count);

  if(totalFlags === 0){
    return `
      <div class="panel" style="padding:18px 20px;margin-top:22px;">
        <div style="font-family:'Space Grotesk';font-size:14px;font-weight:600;margin-bottom:4px;">Performance overview</div>
        <div class="hint">No violations flagged for this team in ${currentMonth}.</div>
      </div>
    `;
  }

  return `
    <div class="panel" style="padding:18px 20px;margin-top:22px;">
      <div style="font-family:'Space Grotesk';font-size:14px;font-weight:600;margin-bottom:14px;">Performance overview</div>

      <div class="stat-row" style="margin-bottom:20px;">
        <div class="stat-chip"><div class="n">${totalFlags}</div><div class="l">Total flags</div></div>
        <div class="stat-chip"><div class="n">${pmeCount}</div><div class="l">PME</div></div>
        <div class="stat-chip"><div class="n">${dnmeCount}</div><div class="l">DNME</div></div>
        <div class="stat-chip"><div class="n">${plainCount}</div><div class="l">Flagged (no severity)</div></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
        <div>
          <div style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);margin-bottom:10px;">Top flagged violations</div>
          ${topItems.map(([item,count])=>`
            <div style="margin-bottom:10px;">
              <div style="display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:4px;">
                <span style="overflow-wrap:anywhere;">${escapeHtml(item)}</span><span style="font-family:'IBM Plex Mono';color:var(--ink-soft);flex-shrink:0;">${count}</span>
              </div>
              <span class="pct-bar" style="width:100%;"><span style="width:${maxTop ? Math.round(count/maxTop*100) : 0}%;background:var(--status-absent);"></span></span>
            </div>
          `).join('')}
        </div>
        <div>
          <div style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);margin-bottom:10px;">Flags by interpreter</div>
          ${topInterpreters.filter(x=>x.count>0).map(x=>`
            <div style="display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--border);">
              <span style="overflow-wrap:anywhere;">${escapeHtml(nameOf(x.id))}</span><span style="font-family:'IBM Plex Mono';color:var(--ink-soft);flex-shrink:0;">${x.count}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

/* ================= Team Chat UI ================= */
async function getChatSignedUrls(paths){
  const unique = [...new Set(paths.filter(Boolean))];
  const map = {};
  await Promise.all(unique.map(async p=>{ map[p] = await getChatAttachmentSignedUrl(p); }));
  return map;
}
function chatInitial(name){ return (name||'?').trim().charAt(0).toUpperCase() || '?'; }
function fmtChatTime(iso){
  try{ return new Date(iso).toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }); }
  catch(e){ return ''; }
}

async function renderChatMessages(isInitial){
  const el = document.getElementById('chatMain');
  if(!el) return;
  const channel = channels.find(c=>c.id===currentChannelId);
  if(!channel) return;
  const msgs = messagesCache[currentChannelId] || [];
  const signedUrls = await getChatSignedUrls(msgs.map(m=>m.attachment_path));

  el.innerHTML = `
    <div class="chat-header">#&nbsp;${escapeHtml(channel.name)}${!channel.is_fixed ? `<button class="btn btn-sm btn-danger" id="deleteChannelBtn">Delete channel</button>` : ''}</div>
    <div class="chat-messages" id="chatMessagesList">
      ${msgs.length === 0 ? `<div class="hint" style="padding:20px;">No messages yet — say hello.</div>` : msgs.map(m=>{
        const name = managerName(m.user_id);
        const isImage = m.attachment_type && m.attachment_type.startsWith('image/');
        const url = signedUrls[m.attachment_path];
        return `
        <div class="chat-msg">
          <div class="chat-msg-avatar">${escapeHtml(chatInitial(name))}</div>
          <div style="min-width:0;flex:1;">
            <span class="chat-msg-name">${escapeHtml(name)}</span><span class="chat-msg-time">${fmtChatTime(m.created_at)}</span>
            ${m.body ? `<div class="chat-msg-body">${escapeHtml(m.body)}</div>` : ''}
            ${m.attachment_path ? `
              <div class="chat-msg-attach">
                ${isImage
                  ? (url ? `<img src="${url}" data-view-img="${url}">` : `<div class="hint">Image unavailable</div>`)
                  : `<a class="chat-msg-file" href="${url||'#'}" target="_blank" rel="noopener">&#128206; ${escapeHtml(m.attachment_name||'file')}</a>`}
              </div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="chat-composer">
      <label class="chat-attach-btn" title="Attach a file or image">&#128206;<input type="file" id="chatFileInput" style="display:none;"></label>
      <textarea id="chatBodyInput" placeholder="Message #${escapeHtml(channel.name)}" rows="1"></textarea>
      <button class="btn btn-primary" id="chatSendBtn">Send</button>
    </div>
  `;

  const list = document.getElementById('chatMessagesList');
  if(list) list.scrollTop = list.scrollHeight;

  const delBtn = document.getElementById('deleteChannelBtn');
  if(delBtn){
    delBtn.addEventListener('click', async ()=>{
      if(!confirm(`Delete #${channel.name}? This deletes all its messages too.`)) return;
      const ok = await deleteChannelById(channel.id);
      if(ok){ currentChannelId = null; refresh(); }
    });
  }

  document.querySelectorAll('[data-view-img]').forEach(img=>{
    img.addEventListener('click', ()=> openImageModal(img.dataset.viewImg));
  });

  const send = async ()=>{
    const body = document.getElementById('chatBodyInput').value;
    const file = document.getElementById('chatFileInput').files[0];
    if(!body.trim() && !file) return;
    document.getElementById('chatSendBtn').disabled = true;
    const ok = await sendChatMessage(currentChannelId, body, file);
    if(ok){
      document.getElementById('chatBodyInput').value = '';
      document.getElementById('chatFileInput').value = '';
    }else{
      document.getElementById('chatSendBtn').disabled = false;
    }
  };
  document.getElementById('chatSendBtn').addEventListener('click', send);
  document.getElementById('chatBodyInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });
}

function renderVoiceRoom(){
  const el = document.getElementById('chatMain');
  if(!el) return;
  const channel = channels.find(c=>c.id===currentChannelId);
  if(!channel) return;
  const inThisRoom = voiceChannelId === channel.id;
  const occupants = voiceChannelOccupants[channel.id] || {};
  const participantIds = Object.keys(occupants);

  el.innerHTML = `
    <div class="chat-header">&#128266;&nbsp;${escapeHtml(channel.name)}${!channel.is_fixed ? `<button class="btn btn-sm btn-danger" id="deleteChannelBtn">Delete channel</button>` : ''}</div>
    <div class="voice-room">
      <div class="voice-participants">
        ${inThisRoom && participantIds.length ? participantIds.map(id=>`
          <div class="voice-avatar" id="voice-avatar-${id}"><div class="circle">${escapeHtml(chatInitial(occupants[id].name))}</div><div class="vname">${occupants[id].muted ? '&#128263; ' : ''}${escapeHtml(occupants[id].name)}${id===currentManagerId?' (you)':''}</div></div>
        `).join('') : `<div class="hint">${inThisRoom ? "You're the only one here right now." : 'Nobody in this call yet.'}</div>`}
      </div>
      <div class="voice-controls">
        ${inThisRoom ? `
          <button class="btn ${voiceMuted?'btn-danger':''}" id="voiceMuteBtn">${voiceMuted ? '&#128263; Unmute' : '&#127908; Mute'}</button>
          <button class="btn btn-danger" id="voiceLeaveBtn">Leave call</button>
        ` : `<button class="btn btn-primary" id="voiceJoinBtn">Join voice</button>`}
      </div>
      <div class="hint" style="max-width:360px;text-align:center;">Free peer-to-peer audio — best for small calls. If someone's on a very restrictive network, they may occasionally have trouble connecting.</div>
    </div>
  `;

  const delBtn = document.getElementById('deleteChannelBtn');
  if(delBtn){
    delBtn.addEventListener('click', async ()=>{
      if(!confirm(`Delete voice channel "${channel.name}"?`)) return;
      if(voiceChannelId === channel.id) await leaveVoiceChannel();
      const ok = await deleteChannelById(channel.id);
      if(ok){ currentChannelId = null; refresh(); }
    });
  }

  const joinBtn = document.getElementById('voiceJoinBtn');
  if(joinBtn) joinBtn.addEventListener('click', ()=> runVoiceAction(async ()=>{ await joinVoiceChannel(channel.id); renderVoiceRoom(); }));
  const leaveBtn = document.getElementById('voiceLeaveBtn');
  if(leaveBtn) leaveBtn.addEventListener('click', ()=> runVoiceAction(async ()=>{ await leaveVoiceChannel(); renderVoiceRoom(); }));
  const muteBtn = document.getElementById('voiceMuteBtn');
  if(muteBtn) muteBtn.addEventListener('click', ()=> runVoiceAction(async ()=>{ await toggleVoiceMute(); renderVoiceRoom(); }));
}

function exportMonthCsv(){
  ensureMonthLoaded(currentMonth).then(()=>{
    const n = daysInMonth(currentMonth);
    const todayYm = todayStr().slice(0,7);
    const lastDay = (currentMonth === todayYm) ? Number(todayStr().slice(8,10)) : n;
    const idSet = new Set(roster.map(p=>p.id));
    for(let d=1; d<=lastDay; d++){
      const day = attendanceCache[currentMonth + '-' + pad(d)] || {};
      Object.keys(day).forEach(id=>idSet.add(id));
    }
    const nameOf = id => (roster.find(p=>p.id===id)?.name) || '(removed)';
    const ids = [...idSet].sort((a,b)=> nameOf(a).localeCompare(nameOf(b)));
    let rows = [['Interpreter', ...Array.from({length:lastDay},(_,i)=>'Day '+(i+1))]];
    ids.forEach(id=>{
      const row = [nameOf(id)];
      for(let d=1; d<=lastDay; d++){
        const s = (attendanceCache[currentMonth+'-'+pad(d)]||{})[id]?.status || '';
        row.push(s);
      }
      rows.push(row);
    });
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `qa-ninjas-attendance-${currentMonth}.csv`;
    a.click();
  });
}

}
function itemOptionsHtml(category, selectedItem){
  const cat = VIOLATION_CATALOG.find(c=>c.category===category) || VIOLATION_CATALOG[0];
  return cat.items.map(i=>`<option value="${escapeAttr(i.label)}" ${i.label===selectedItem?'selected':''}>${escapeHtml(i.label)}</option>`).join('');
}
function severityBadge(severity){
  if(severity === 'PME') return `<span class="sev-badge sev-PME">PME</span>`;
  if(severity === 'DNME') return `<span class="sev-badge sev-DNME">DNME</span>`;
  return `<span class="sev-badge sev-NA">Flagged</span>`;
}
// Wires a category-select + item-select + severity-select trio so item options and
// severity visibility update live as the manager picks a category/item.
function wireCatItemSev(catSel, itemSel, sevSel){
  const refreshSeverity = ()=>{
    const item = catalogItem(catSel.value, itemSel.value);
    const applies = item ? item.severity : true;
    sevSel.style.display = applies ? '' : 'none';
    if(!applies) sevSel.value = '';
  };
  catSel.addEventListener('change', ()=>{
    itemSel.innerHTML = itemOptionsHtml(catSel.value);
    refreshSeverity();
  });
  itemSel.addEventListener('change', refreshSeverity);
  refreshSeverity();
}

function renderPerformanceBody(scope){
  const body = document.getElementById('perfBody');
  const nameOf = id => (roster.find(p=>p.id===id)?.name) || '(removed)';

  const filteredScope = perfInterpreterFilter ? scope.filter(p=>p.id===perfInterpreterFilter) : scope;

  // Monthly + all-time counts per interpreter, broken down by the specific
  // violation item flagged (not just its broad category) — e.g. "Transparency ×1".
  // Counts individual violations (items), not QAR submissions (records), since
  // one submission can hold several.
  const stats = {};
  filteredScope.forEach(p=>{
    const all = violationsCache[p.id] || [];
    const monthRecords = all.filter(v=>v.date.slice(0,7) === currentMonth);
    const byItem = {};
    let monthItemCount = 0, allItemCount = 0;
    all.forEach(v=> allItemCount += (v.items||[]).length);
    monthRecords.forEach(v=>{
      (v.items||[]).forEach(it=>{
        byItem[it.item] = (byItem[it.item]||0) + 1;
        monthItemCount++;
      });
    });
    stats[p.id] = { total: allItemCount, thisMonth: monthItemCount, byItem };
  });

  // Flat list of this month's QAR records across the filtered scope, most recent first.
  const monthLog = [];
  filteredScope.forEach(p=>{
    (violationsCache[p.id]||[]).filter(v=>v.date.slice(0,7)===currentMonth).forEach(v=>{
      monthLog.push({ interpreterId: p.id, ...v });
    });
  });
  monthLog.sort((a,b)=> b.date.localeCompare(a.date) || (a.createdAt||'').localeCompare(b.createdAt||''));

  if(filteredScope.length === 0){
    body.innerHTML = `<div class="panel"><div class="empty-state"><div class="big">No interpreter selected</div><div>Pick a different interpreter, or choose "All interpreters" above.</div></div></div>`;
    return;
  }

  const monthLogTotalItems = monthLog.reduce((sum,v)=> sum + (v.items||[]).length, 0);

  body.innerHTML = `
    <div class="stat-row" style="margin-bottom:20px;">
      <div class="stat-chip"><div class="n">${monthLog.length}</div><div class="l">Logs this month</div></div>
      <div class="stat-chip"><div class="n">${monthLogTotalItems}</div><div class="l">Violations flagged</div></div>
    </div>

    <div class="panel" style="margin-bottom:22px;">
      <div class="summary-scroll">
      <table class="month-summary violation-summary">
        <thead><tr>
          <th style="width:150px;">Interpreter</th><th style="width:90px;">This month</th><th style="width:90px;">All-time</th>
          <th>Violations flagged this month</th>
        </tr></thead>
        <tbody>
          ${filteredScope.map(p=>{
            const items = Object.entries(stats[p.id].byItem).sort((a,b)=>b[1]-a[1]);
            return `
            <tr>
              <td style="font-family:'Inter';font-size:13.5px;">${escapeHtml(p.name)}</td>
              <td>${stats[p.id].thisMonth}</td>
              <td>${stats[p.id].total}</td>
              <td>${items.length ? items.map(([item,count])=>`<span class="item-pill">${escapeHtml(item)} ×${count}</span>`).join(' ') : '<span style="color:var(--ink-faint);">—</span>'}</td>
            </tr>
          `;}).join('')}
        </tbody>
      </table>
      </div>
    </div>

    <div class="panel">
      ${monthLog.length === 0 ? `
        <div class="empty-state">
          <div class="big">No flags this month</div>
          <div>Nice — nothing logged for this team in ${currentMonth}.</div>
        </div>
      ` : `
      <table>
        <thead><tr>
          <th style="width:110px">Date</th>
          <th style="width:130px">QAR ID</th>
          <th style="width:150px">Interpreter</th>
          <th style="width:340px">Violation(s)</th>
          <th>Note</th>
          <th style="width:60px"></th>
        </tr></thead>
        <tbody>
          ${monthLog.map(v=>`
            <tr data-vid="${v.id}" data-pid="${v.interpreterId}">
              <td><input type="date" class="note-input" data-vfield="date" value="${v.date}"></td>
              <td><input type="text" class="note-input qar-tag" data-vfield="qar" value="${escapeAttr(v.qar||'')}" placeholder="QAR ID"></td>
              <td>${escapeHtml(nameOf(v.interpreterId))}<div class="interp-role">by ${escapeHtml(managerName(v.loggedBy))}</div>${v.autoImported ? `<div class="interp-role" style="color:var(--status-late);">auto-imported</div>` : ''}</td>
              <td>
                ${(v.items||[]).map((it,idx)=>`
                  <div class="qar-item-row" data-item-idx="${idx}" style="display:flex;align-items:center;gap:5px;margin-bottom:6px;flex-wrap:wrap;">
                    <select class="note-input" data-vfield="category" style="min-width:140px;">${violationOptionsHtml(it.category)}</select>
                    <select class="note-input" data-vfield="item" style="min-width:140px;">${itemOptionsHtml(it.category, it.item)}</select>
                    <select class="note-input" data-vfield="severity" style="width:90px;${catalogItem(it.category, it.item)?.severity ? '' : 'display:none;'}">
                      <option value="">—</option>
                      <option value="PME" ${it.severity==='PME'?'selected':''}>PME</option>
                      <option value="DNME" ${it.severity==='DNME'?'selected':''}>DNME</option>
                    </select>
                    ${!catalogItem(it.category, it.item)?.severity ? severityBadge('') : ''}
                    ${(v.items||[]).length > 1 ? `<button type="button" class="btn btn-sm btn-danger" data-item-remove title="Remove this violation">×</button>` : ''}
                  </div>
                `).join('')}
              </td>
              <td><input type="text" class="note-input" data-vfield="note" value="${escapeAttr(v.note||'')}" placeholder="Note…"></td>
              <td><button class="btn btn-sm btn-danger" data-vdelete="${v.id}" data-vpid="${v.interpreterId}">Del</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>`}
    </div>
  `;

  // wire per-row date/qar/note + per-item category/item/severity/remove
  document.querySelectorAll('[data-vid]').forEach(row=>{
    const vid = row.dataset.vid, pid = row.dataset.pid;
    const dateInp = row.querySelector('[data-vfield="date"]');
    const qarInp = row.querySelector('[data-vfield="qar"]');
    const noteInp = row.querySelector('[data-vfield="note"]');

    const findRecord = ()=> (violationsCache[pid]||[]).find(x=>x.id===vid);

    const persistHeader = async ()=>{
      const rec = findRecord();
      if(!rec) return;
      rec.date = dateInp.value || rec.date;
      rec.qar = qarInp.value.trim();
      rec.note = noteInp.value.trim();
      await saveViolations(pid);
    };
    dateInp.addEventListener('change', async ()=>{ await persistHeader(); refresh(); });
    qarInp.addEventListener('change', persistHeader);
    noteInp.addEventListener('change', persistHeader);

    row.querySelectorAll('.qar-item-row').forEach(itemRow=>{
      const idx = Number(itemRow.dataset.itemIdx);
      const catSel = itemRow.querySelector('[data-vfield="category"]');
      const itemSel = itemRow.querySelector('[data-vfield="item"]');
      const sevSel = itemRow.querySelector('[data-vfield="severity"]');
      const removeBtn = itemRow.querySelector('[data-item-remove]');

      wireCatItemSev(catSel, itemSel, sevSel);

      const persistItem = async ()=>{
        const rec = findRecord();
        if(!rec || !rec.items[idx]) return;
        rec.items[idx].category = catSel.value;
        rec.items[idx].item = itemSel.value;
        const def = catalogItem(rec.items[idx].category, rec.items[idx].item);
        rec.items[idx].severity = def && def.severity ? sevSel.value : '';
        await saveViolations(pid);
      };
      [catSel, itemSel, sevSel].forEach(el=> el.addEventListener('change', async ()=>{ await persistItem(); refresh(); }));

      if(removeBtn){
        removeBtn.addEventListener('click', async ()=>{
          const rec = findRecord();
          if(!rec) return;
          if(!confirm('Remove this violation from the log?')) return;
          rec.items.splice(idx, 1);
          await saveViolations(pid);
          refresh();
        });
      }
    });
  });

  document.querySelectorAll('[data-vdelete]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const pid = btn.dataset.vpid, vid = btn.dataset.vdelete;
      if(!confirm('Delete this entire log entry (all violations under this QAR)? This cannot be undone.')) return;
      violationsCache[pid] = (violationsCache[pid]||[]).filter(x=>x.id!==vid);
      await saveViolations(pid);
      refresh();
    });
  });
}
