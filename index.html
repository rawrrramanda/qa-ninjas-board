<style>
  :root{
    --bg-app:#F4F5F1;
    --bg-panel:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6672;
    --ink-faint:#94A0A0;
    --border:#E1E4DD;
    --sidebar-bg:#132029;
    --sidebar-ink:#D6E2E2;
    --sidebar-ink-dim:#7C9091;
    --accent:#2F7A8C;
    --accent-dark:#215A68;
    --accent-soft:#E4EEEF;
    --accent-warm:#E0793C;
    --status-present:#3F8F5F;
    --status-present-soft:#E5F2EA;
    --status-absent:#C24444;
    --status-absent-soft:#F8E9E9;
    --status-leave:#8A7EC8;
    --status-leave-soft:#EFEDF8;
    --status-late:#C98A26;
    --status-late-soft:#FBF0DD;
    --status-off:#8B9696;
    --status-off-soft:#EEF0EE;
    --radius:10px;
    --shadow:0 1px 2px rgba(20,30,30,0.06), 0 4px 16px rgba(20,30,30,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg-app);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:220px;
    flex-shrink:0;
    background:var(--sidebar-bg);
    color:var(--sidebar-ink);
    display:flex;
    flex-direction:column;
    padding:24px 16px;
  }
  .brand{padding:0 8px 24px 8px;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:18px;}
  .brand-mark{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.02em;
    color:#fff;
    display:flex;align-items:center;gap:8px;
  }
  .brand-mark .ninja-icon{flex-shrink:0;height:26px;width:auto;display:block;}
  .brand-sub{font-size:11.5px;color:var(--sidebar-ink-dim);margin-top:4px;letter-spacing:0.03em;text-transform:uppercase;}
  nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 10px;border-radius:8px;
    font-size:14px;font-weight:500;cursor:pointer;
    color:var(--sidebar-ink-dim);
    transition:background .15s, color .15s;
    border:none;background:none;text-align:left;width:100%;
    font-family:inherit;
  }
  .nav-item:hover{background:rgba(255,255,255,0.06);color:var(--sidebar-ink);}
  .nav-item.active{background:rgba(47,122,140,0.35);color:#fff;}
  .nav-item .ic{width:16px;text-align:center;font-size:14px;opacity:0.9;}
  .sidebar-foot{
    margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,0.08);
    font-size:11px;color:var(--sidebar-ink-dim);line-height:1.5;
  }

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;padding:28px 36px 60px;}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;}
  .page-title .sub{display:block;font-family:'Inter';font-size:13px;font-weight:400;color:var(--ink-soft);margin-top:3px;}

  .btn{
    font-family:'Inter';font-size:13.5px;font-weight:600;
    padding:9px 14px;border-radius:8px;border:1px solid var(--border);
    background:var(--bg-panel);color:var(--ink);cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    transition:border-color .15s, background .15s;
  }
  .btn:hover{border-color:var(--accent);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--accent-soft);}
  .btn-danger{color:var(--status-absent);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-sm{padding:6px 10px;font-size:12.5px;}

  .date-nav{display:flex;align-items:center;gap:6px;}
  .date-nav input[type=date], .date-nav input[type=month]{
    font-family:'IBM Plex Mono';font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-panel);color:var(--ink);
  }

  .stat-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .stat-chip{
    background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px 16px;min-width:86px;box-shadow:var(--shadow);
  }
  .stat-chip .n{font-family:'IBM Plex Mono';font-size:20px;font-weight:500;}
  .stat-chip .l{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin-top:2px;}

  .panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}

  table{width:100%;border-collapse:collapse;}
  th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;
    color:var(--ink-soft);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--border);
    background:#FAFAF8;
  }
  td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13.5px;}
  tr:last-child td{border-bottom:none;}
  .interp-name{font-weight:600;}
  .interp-role{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}

  .status-pills{display:flex;gap:5px;flex-wrap:wrap;}
  .pill{
    font-family:'IBM Plex Mono';font-size:11.5px;font-weight:500;
    padding:5px 9px;border-radius:20px;border:1.5px solid var(--border);
    background:#fff;color:var(--ink-soft);cursor:pointer;transition:all .12s;
  }
  .pill:hover{border-color:var(--accent);}
  .pill.sel-P{background:var(--status-present-soft);border-color:var(--status-present);color:var(--status-present);}
  .pill.sel-A{background:var(--status-absent-soft);border-color:var(--status-absent);color:var(--status-absent);}
  .pill.sel-U{background:var(--status-leave-soft);border-color:var(--status-leave);color:var(--status-leave);}
  .pill.sel-N{background:var(--status-late-soft);border-color:var(--status-late);color:var(--status-late);}
  .pill.sel-O{background:var(--status-off-soft);border-color:var(--status-off);color:var(--status-off);}

  .upload-cell{display:flex;align-items:flex-start;gap:8px;}
  .thumb{
    width:38px;height:38px;border-radius:6px;object-fit:cover;cursor:pointer;
    border:1px solid var(--border);flex-shrink:0;background:#f2f2f0;
  }
  .thumb-empty{
    width:38px;height:38px;border-radius:6px;border:1.5px dashed var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:15px;flex-shrink:0;
  }
  .upload-actions{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
  .upload-label{
    display:inline-flex;align-items:center;

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const CONFIG_MISSING = SUPABASE_URL.includes('YOUR_') || SUPABASE_ANON_KEY.includes('YOUR_');

/* ================= Storage helpers =================
   Same key/value shape as before (one row per key, JSON value) so the rest of
   the app — every storageGet/storageSet call — is completely unchanged. */
async function storageGet(key){
  try{
    const { data, error } = await supabaseClient.from('kv_store').select('value').eq('key', key).maybeSingle();
    if(error){ console.error('storage get failed for', key, error); return null; }
    if(!data) return null;
    return data.value;
  }catch(e){ console.error('storage get threw for', key, e); return null; }
}
async function storageSet(key, value){
  try{
    const { error } = await supabaseClient.from('kv_store')
      .upsert({ key, value, updated_at: new Date().toISOString() }, { onConflict: 'key' });
    if(error){ console.error('storage set failed for', key, error); return false; }
    return true;
  }catch(e){ console.error('storage set threw for', key, e); return false; }
}

// Uploads a compressed image blob to Storage and returns its internal path (not
// a URL). We deliberately don't store a permanent public URL — screenshots are
// only viewable through short-lived signed URLs generated on demand, so a
// leaked/logged URL can't be used to view the image indefinitely.
async function uploadScreenshot(blob, pathHint){
  try{
    const path = `${pathHint}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
    const { error } = await supabaseClient.storage.from(SCREENSHOTS_BUCKET).upload(path, blob, {
      contentType: 'image/jpeg', upsert: false
    });
    if(error){ console.error('upload failed', error); return null; }
    return path;
  }catch(e){ console.error('upload failed', e); return null; }
}

// Handles both old-format stored values (full public URLs, from before the
// bucket was made private) and new-format ones (bare paths), so existing
// screenshots keep working without needing a one-time data migration.
function pathFromStoredValue(value){
  if(!value) return null;
  const marker = `/${SCREENSHOTS_BUCKET}/`;
  const idx = value.indexOf(marker);
  if(idx === -1) return value; // already a bare path
  return decodeURIComponent(value.slice(idx + marker.length).split('?')[0]);
}

const SIGNED_URL_TTL = 3600; // 1 hour — regenerated fresh on every page load/refresh
async function getSignedUrl(path){
  if(!path) return null;
  try{
    const { data, error } = await supabaseClient.storage.from(SCREENSHOTS_BUCKET).createSignedUrl(path, SIGNED_URL_TTL);
    if(error){ console.error('signed url failed', error); return null; }
    return data?.signedUrl || null;
  }catch(e){ console.error('signed url failed', e); return null; }
}
// Batches signed-URL generation for every screenshot on screen at once, rather
// than one request per thumbnail.
async function getSignedUrls(storedValues){
  const paths = [...new Set(storedValues.map(pathFromStoredValue).filter(Boolean))];
  const map = {};
  await Promise.all(paths.map(async p=>{ map[p] = await getSignedUrl(p); }));
  return map;
}

// Deletes the actual file from Storage, so removing a screenshot in the app
// also frees the space — not just hides the reference. Accepts either an old
// full URL or a new bare path.
async function deleteScreenshot(storedValue){
  try{
    const path = pathFromStoredValue(storedValue);
    if(!path) return false;
    const { error } = await supabaseClient.storage.from(SCREENSHOTS_BUCKET).remove([path]);
    if(error){ console.error('delete failed', error); return false; }
    return true;
  }catch(e){ console.error('delete failed', e); return false; }
}

async function uploadAvatarBlob(managerId, blob){
  try{
    const existing = managersList.find(m=>m.user_id===managerId);
    if(existing && existing.avatar_path){
      try{ await supabaseClient.storage.from(AVATAR_BUCKET).remove([existing.avatar_path]); }catch(e){}
    }
    const path = `${managerId}/${Date.now()}.png`;
    const { error: upErr } = await supabaseClient.storage.from(AVATAR_BUCKET).upload(path, blob, { contentType: 'image/png', upsert: false });
    if(upErr){ console.error('avatar upload failed', upErr); showToast('Could not upload picture'); return false; }
    const { data: updRows, error: dbErr } = await supabaseClient.from('managers').update({ avatar_path: path }).eq('user_id', managerId).select();
    if(dbErr){ console.error('avatar db update failed', dbErr); showToast('Could not save picture'); return false; }
    if(!updRows || updRows.length === 0){
      console.error('avatar db update affected 0 rows — likely a permissions issue');
      showToast('Could not save picture — permission issue, check console');
      return false;
    }
    if(existing) existing.avatar_path = path;
    avatarUrlCache = {};
    await getAvatarSignedUrl(path); // warm the cache now, so the caller's immediate re-render already has it
    return true;
  }catch(e){ console.error('avatar upload failed', e); showToast('Could not upload picture'); return false; }
}

async function removeAvatar(managerId){
  const existing = managersList.find(m=>m.user_id===managerId);
  if(!existing || !existing.avatar_path) return true;
  try{ await supabaseClient.storage.from(AVATAR_BUCKET).remove([existing.avatar_path]); }catch(e){}
  const { data: updRows, error } = await supabaseClient.from('managers').update({ avatar_path: null }).eq('user_id', managerId).select();
  if(error){ console.error('avatar remove failed', error); showToast('Could not remove picture'); return false; }
  if(!updRows || updRows.length === 0){
    console.error('avatar remove affected 0 rows — likely a permissions issue');
    showToast('Could not remove picture — permission issue, check console');
    return false;
  }
  existing.avatar_path = null;
  avatarUrlCache = {};
  return true;
}

async function getAvatarSignedUrl(path){
  if(!path) return null;
  if(avatarUrlCache[path]) return avatarUrlCache[path];
  try{
    // A week, not an hour — unlike screenshots, profile pictures aren't
    // sensitive, so there's no real downside to a much longer-lived link,
    // and it drastically cuts down on how often a cached link can go stale
    // during a long session.
    const { data, error } = await supabaseClient.storage.from(AVATAR_BUCKET).createSignedUrl(path, 604800);
    if(error){ console.error('avatar signed url failed', error); return null; }
    avatarUrlCache[path] = data?.signedUrl || null;
    return avatarUrlCache[path];
  }catch(e){ return null; }
}

// Batch-resolves signed URLs for a set of managers at once — call before
// building any HTML that shows avatars, since signing is async but template
// strings aren't.
async function getAvatarUrlMapFor(managerIds){
  const map = {};
  await Promise.all([...new Set(managerIds)].map(async id=>{
    const m = managersList.find(mm=>mm.user_id===id);
    if(m && m.avatar_path) map[id] = await getAvatarSignedUrl(m.avatar_path);
  }));
  return map;
}

// Renders either the real picture or an initials circle, sized/styled by
// whatever class the call site already uses for its avatar circles.
// Self-healing for broken avatar images — a stale cached signed URL (or any
// other one-off load failure) triggers exactly one retry with a freshly
// generated URL. If even that fails (the file's genuinely gone), it falls
// back to an initials circle instead of leaving a broken-image icon.
async function handleAvatarLoadError(imgEl, managerId){
  if(imgEl.dataset.retried){
    replaceAvatarImgWithInitials(imgEl, managerId);
    return;
  }
  imgEl.dataset.retried = 'true';
  const m = managersList.find(mm=>mm.user_id===managerId);
  if(!m || !m.avatar_path){ replaceAvatarImgWithInitials(imgEl, managerId); return; }
  delete avatarUrlCache[m.avatar_path]; // the cached link is the one that just failed — drop it
  const freshUrl = await getAvatarSignedUrl(m.avatar_path);
  if(freshUrl){
    imgEl.src = freshUrl;
    imgEl.dataset.viewImg = freshUrl;
  }else{
    replaceAvatarImgWithInitials(imgEl, managerId);
  }
}
function replaceAvatarImgWithInitials(imgEl, managerId){
  const div = document.createElement('div');
  div.className = imgEl.className;
  div.textContent = chatInitial(managerName(managerId));
  imgEl.replaceWith(div);
}

}

/* ================= Image compression ================= */
function compressFile(file, maxWidth, quality){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > maxWidth){ h = Math.round(h * maxWidth / w); w = maxWidth; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=>{
        if(blob) resolve(blob); else reject(new Error('toBlob failed'));
      }, 'image/jpeg', quality);
    };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}
async function compressForStorage(file){
  // Real file storage (not a JSON field), so this is about reasonable load times,
  // not squeezing under a text-size ceiling — a bit more headroom than before.
  let out = await compressFile(file, 900, 0.72);
  if(out.size > 900000){
    out = await compressFile(file, 640, 0.65);
  }
  if(out.size > 900000){
    out = await compressFile(file, 480, 0.55);
  }
  return out;
}

// RFC4180-ish CSV parser — handles quoted fields with embedded commas,
// newlines, and "" escaped quotes, which the QA export relies on heavily.
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false, i = 0;
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM
  while(i < text.length){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    }else{
      if(c === '"'){ inQuotes = true; i++; continue; }
      if(c === ','){ row.push(field); field = ''; i++; continue; }
      if(c === '\r'){ i++; continue; }
      if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += c; i++; continue;
    }
  }
  if(field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
  return rows;
}

// Strips HTML tags/entities from a QA note field down to clean plain text.
function stripHtmlNote(html){
  const div = document.createElement('div');
  div.innerHTML = html
    .replace(/<\/p>/gi, '\n')
    .replace(/<br\s*\/?>/gi, '\n');
  const text = div.textContent || '';
  return text.replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}

// CSV export uses M/D/YY (e.g. "8/3/26"); convert to YYYY-MM-DD.
function parseCsvDate(s){
  const parts = (s||'').split('/').map(x=>x.trim());
  if(parts.length !== 3) return null;
  const [m,d,y] = parts;
  const yyyy = y.length === 2 ? '20'+y : y;
  return `${yyyy}-${pad(Number(m))}-${pad(Number(d))}`;
}

function csvSeverity(status){
  if(status === 'Partially meets expectations') return 'PME';
  if(status === 'Does not meet expectations') return 'DNME';
  return '';
}

// Two item-sets are "the same" if they contain the same {item, severity}
// pairs, regardless of order — used to detect whether an existing log matches
// what the CSV says should be flagged.
function itemSetsMatch(a, b){
  if(a.length !== b.length) return false;
  const norm = arr => arr.map(x=>`${x.item}::${x.severity||''}`).sort();
  const na = norm(a), nb = norm(b);
  return na.every((v,i)=> v === nb[i]);
}

/* ---- Persistent import review queue (unmatched names / mismatches) ---- */
let importReviewCache = null;
async function loadImportReview(){
  if(importReviewCache) return importReviewCache;
  const r = await storageGet('import-review-log');
  importReviewCache = r || [];
  return importReviewCache;
}
async function saveImportReview(){
  await storageSet('import-review-log', importReviewCache || []);
}

// Processes an uploaded CSV: matches each row's interpreter and manager,
// checks existing logs for that QAR, and either confirms a match, flags a
// mismatch for manual review, auto-creates a missing log, or queues unmatched
// names for review. Never overwrites an existing log automatically.
async function processImportedCsv(csvText){
  const rows = parseCSV(csvText);
  if(rows.length < 2) return { error: 'CSV appears to be empty.' };
  const header = rows[0];
  const idx = name => header.indexOf(name);
  const need = ['Agent Name','Owner Name','QA','Interpretation date'];
  for(const col of need){
    if(idx(col) === -1) return { error: `Missing expected column: "${col}". Is this the right file?` };
  }

  await loadImportReview();
  const activeRoster = roster; // match against full roster (active + inactive), not just active
  const summary = { skippedClean: 0, alreadyMatched: 0, autoLogged: 0, mismatched: 0, unmatchedInterpreter: 0, unmatchedManager: 0, errors: 0 };

  for(let r=1; r<rows.length; r++){
    const row = rows[r];
    if(row.length < header.length) continue; // skip malformed/blank trailing rows
    const agentName = (row[idx('Agent Name')]||'').trim();
    const ownerNameRaw = (row[idx('Owner Name')]||'').trim();
    const qar = (row[idx('QA')]||'').trim();
    const date = parseCsvDate(row[idx('Interpretation date')]);
    if(!agentName || !qar || !date){ summary.errors++; continue; }

    const items = [];
    CSV_COLUMN_MAP.forEach(m=>{
      const status = (row[idx(m.col)]||'').trim();
      if(status && status !== 'Meets expectations'){
        let severity = csvSeverity(status);
        const def = catalogItem(m.category, m.item);
        if(!def || !def.severity) severity = (def && def.autoDnme) ? 'DNME' : ''; // exempt items: auto-DNME, ignoring whatever the CSV says
        items.push({ category: m.category, item: m.item, severity });
      }
    });
    if(items.length === 0){ summary.skippedClean++; continue; }

    const note = CSV_NOTE_COLUMNS.map(col => row[idx(col)]).filter(v=>v && v.trim()).map(stripHtmlNote).join('\n\n');

    const interp = activeRoster.find(p=> normalizeName(p.name) === normalizeName(agentName));
    const mappedManagerName = OWNER_NAME_MAP_NORMALIZED[normalizeName(ownerNameRaw)] || null;
    const managerRec = mappedManagerName ? managersList.find(m=> normalizeName(m.name) === normalizeName(mappedManagerName)) : null;

    if(!interp){
      queueReviewItem({ type:'unmatched-interpreter', qar, date, agentName, ownerNameRaw, items, note });
      summary.unmatchedInterpreter++;
      continue;
    }
    if(!managerRec){
      queueReviewItem({ type:'unmatched-manager', qar, date, agentName, ownerNameRaw, interpreterId: interp.id, items, note });
      summary.unmatchedManager++;
      continue;
    }

    await ensureViolationsLoaded(interp.id);
    const existing = (violationsCache[interp.id]||[]).find(v=> v.qar && v.qar.trim() === qar);

    if(existing){
      if(itemSetsMatch(existing.items||[], items)){
        summary.alreadyMatched++;
      }else{
        queueReviewItem({ type:'mismatch', qar, date, agentName, ownerNameRaw, interpreterId: interp.id, items, note, existingItems: existing.items||[] });
        summary.mismatched++;
      }
      continue;
    }

    violationsCache[interp.id].push({
      id: uid(), date, qar, note, items,
      loggedBy: managerRec.user_id, createdAt: new Date().toISOString(),
      autoImported: true
    });
    await saveViolations(interp.id);
    summary.autoLogged++;
  }

  await saveImportReview();
  return { summary };
}

function queueReviewItem(item){
  // avoid duplicate queue entries across repeated imports of overlapping data
  const exists = importReviewCache.some(r => r.qar === item.qar && r.type === item.type);
  if(exists) return;
  importReviewCache.push({ id: uid(), createdAt: new Date().toISOString(), ...item });
}

/* ================= Bulk import ================= */
function parseBulkPool(text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    let parts = line.split('\t').map(s=>s.trim());
    if(parts.length < 2){
      parts = line.split(/\s{2,}/).map(s=>s.trim()).filter(Boolean);
    }
    const [name, language, shift, type, offDays] = parts;
    return {name, language: language||'', shift: shift||'', type: type||'', offDays: offDays||''};
  }).filter(r=>r.name);
}
function parseActiveNames(text){
  return new Set(text.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.toLowerCase()));
}
async function importRoster(){
  const poolText = document.getElementById('bulkPool').value;
  const activeText = document.getElementById('bulkActive').value;
  if(!poolText.trim()){ showToast('Paste your interpreter pool first'); return; }
  const pool = parseBulkPool(poolText);
  const activeSet = parseActiveNames(activeText);
  pool.forEach(entry=>{
    const existing = roster.find(p=>p.name.toLowerCase() === entry.name.toLowerCase());
    if(existing){
      existing.language = entry.language;
      existing.shift = entry.shift;
      existing.type = entry.type;
      existing.offDays = entry.offDays;
      existing.active = activeSet.has(entry.name.toLowerCase());
    }else{
      roster.push({id: uid(), name: entry.name, language: entry.language, shift: entry.shift, type: entry.type, offDays: entry.offDays, managerId: currentManagerId, active: activeSet.has(entry.name.toLowerCase())});
    }
  });
  const ok = await storageSet('roster', roster);
  showToast(ok ? 'Roster imported' : 'Import failed — try again');
  if(ok) refresh();
}

// Timezone-independent: given a plain Y-M-D calendar date, which weekday it
// falls on is a fixed fact, not something that depends on the viewer's
// location — using Date.UTC here (same pattern as shiftDate) avoids any
// risk of local-timezone reinterpretation shifting the answer by a day.
function dayOfWeekForDate(dateStr){
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); // 0=Sun .. 6=Sat
}

// Fills in "Off" for anyone whose regular weekly schedule has them off on
// this date — but only where nothing has been recorded yet, so it can never
// clobber an existing entry (manual or otherwise). Marked with autoOff:true
// purely so the UI can show it was automatic; a manager changing the status
// at all clears that marker, since at that point it's a confirmed choice.
// The roster's existing "off days" field is free text (e.g. "Sat & Sun",
// "Thu & Fri") meant for managers to read, not a structured list — this
// scans it for recognizable day names/abbreviations so automation can work
// off the same field rather than asking managers to maintain a second one.
// Word-boundary matching avoids false positives (e.g. "sat" inside another
// word) and handles any separator style (&, comma, "and", slashes...).
const DAY_NAME_MAP = {
  sun:0, sunday:0, mon:1, monday:1, tue:2, tues:2, tuesday:2,
  wed:3, weds:3, wednesday:3, thu:4, thur:4, thurs:4, thursday:4,
  fri:5, friday:5, sat:6, saturday:6,
};
function parseOffDaysText(text){
  if(!text) return [];
  const lower = text.toLowerCase();
  const found = new Set();
  Object.entries(DAY_NAME_MAP).forEach(([name, dow])=>{
    if(new RegExp('\\b' + name + 's?\\b', 'i').test(lower)) found.add(dow);
  });
  return [...found];
}

async function applyOffDayAutoFill(dateStr){
  const day = attendanceCache[dateStr];
  if(!day) return;
  const dow = dayOfWeekForDate(dateStr);
  let changed = false;
  roster.filter(p=>p.active !== false).forEach(p=>{
    const offDaysOfWeek = parseOffDaysText(p.offDays);
    if(offDaysOfWeek.includes(dow) && !day[p.id]){
      day[p.id] = { status: 'O', note: '', autoOff: true };
      changed = true;
    }
  });
  if(changed) await saveDate(dateStr, true);
}

// One-time fix for every already-stored attendance record, run once per board
// (tracked via a marker key so repeat logins skip it instantly). Rewrites the
// old "Leave" code ('L') to the new "Unsure" code ('U'), and the old "Late"
// code ('T') to its new code ('L') — done in a single pass per record, based
// on each entry's original stored value, so the two renames can't collide
// with each other even though 'L' briefly meant something else.
async function migrateStatusCodesOnce(){
  const done = await storageGet('migration:status-codes-v1');
  if(done) return;
  try{
    const { data, error } = await supabaseClient.from('kv_store').select('key,value').like('key', 'attendance:%');
    if(error){ console.error('status code migration scan failed', error); return; }
    for(const row of (data || [])){
      const day = row.value || {};
      let changed = false;
      Object.values(day).forEach(entry=>{
        if(!entry || !entry.status) return;
        if(entry.status === 'L'){ entry.status = 'U'; changed = true; }
        else if(entry.status === 'T'){ entry.status = 'L'; changed = true; }
      });
      if(changed){
        await storageSet(row.key, day);
        if(attendanceCache[row.key.replace('attendance:','')] !== undefined){
          attendanceCache[row.key.replace('attendance:','')] = day;
        }
      }
    }
    await storageSet('migration:status-codes-v1', true);
  }catch(e){ console.error('status code migration failed', e); }
}

// v2: renames "Late" from code 'L' to code 'N' ("Nonadherence"). Separate,
// versioned migration so it runs exactly once regardless of whether v1 has
// already run on this board.
async function migrateStatusCodesV2Once(){
  const done = await storageGet('migration:status-codes-v2');
  if(done) return;

}

/* ---- Violations: one key per interpreter holding their full history ---- */
let violationsCache = {};   // { interpreterId: [ {id, date, qar, note, items:[{category,item,severity}], loggedBy, createdAt} ] }

// One-time migration: the violation record shape changed from "one record per
// flagged item" to "one record per QAR submission, holding an items array".
// This combines any existing legacy records (which have .category/.item
// directly, no .items array) that share the same QAR ID for the same
// interpreter into a single combined record — matching how new submissions
// already behave. Records with no QAR ID are wrapped individually rather than
// merged, since there's no shared identity to group them by.
async function migrateCombineQarLogsOnce(){
  const done = await storageGet('migration:combine-qar-v1');
  if(done) return;
  try{
    const { data, error } = await supabaseClient.from('kv_store').select('key,value').like('key', 'violations:%');
    if(error){ console.error('combine-qar migration scan failed', error); return; }
    for(const row of (data || [])){
      const records = Array.isArray(row.value) ? row.value : [];
      if(records.length === 0) continue;

      const alreadyCombined = records.filter(r => r && Array.isArray(r.items));
      const legacy = records.filter(r => r && !Array.isArray(r.items) && r.category);
      if(legacy.length === 0) continue; // nothing to migrate for this interpreter

      const groups = {};
      const solo = [];
      legacy.forEach(r=>{
        if(r.qar && r.qar.trim()){
          const key = r.qar.trim();
          (groups[key] = groups[key] || []).push(r);
        }else{
          solo.push(r);
        }
      });

      const merged = [];
      Object.values(groups).forEach(group=>{
        group.sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||''));
        const first = group[0];
        const items = group.map(r=>({ category: r.category, item: r.item, severity: r.severity || '' }));
        const notes = [...new Set(group.map(r=>r.note).filter(Boolean))];
        merged.push({
          id: first.id, date: first.date, qar: first.qar,
          note: notes.join(' | '),
          items,
          loggedBy: first.loggedBy, createdAt: first.createdAt
        });
      });
      solo.forEach(r=>{
        merged.push({
          id: r.id, date: r.date, qar: r.qar || '', note: r.note || '',
          items: [{ category: r.category, item: r.item, severity: r.severity || '' }],
          loggedBy: r.loggedBy, createdAt: r.createdAt
        });
      });

      const finalRecords = [...alreadyCombined, ...merged];
      await storageSet(row.key, finalRecords);
      const interpId = row.key.replace('violations:','');
      if(violationsCache[interpId] !== undefined) violationsCache[interpId] = finalRecords;
    }
    await storageSet('migration:combine-qar-v1', true);
  }catch(e){ console.error('combine-qar migration failed', e); }
}

// Renames "Call Etiquette – Professional Voice" to "Call Etiquette – Tone of
// Voice" in every already-stored violation record's items array, matching
// the catalog rename above so historical data still displays/edits correctly.
async function migrateToneOfVoiceLabelOnce(){
  const done = await storageGet('migration:tone-of-voice-v1');
  if(done) return;
  try{
    const { data, error } = await supabaseClient.from('kv_store').select('key,value').like('key', 'violations:%');
    if(error){ console.error('tone-of-voice migration scan failed', error); return; }
    const OLD_LABEL = 'Call Etiquette – Professional Voice';
    const NEW_LABEL = 'Call Etiquette – Tone of Voice';
    for(const row of (data || [])){
      const records = Array.isArray(row.value) ? row.value : [];
      let changed = false;
      records.forEach(rec=>{
        (rec.items || []).forEach(it=>{
          if(it.item === OLD_LABEL){ it.item = NEW_LABEL; changed = true; }
        });
      });
      if(changed){
        await storageSet(row.key, records);
        const interpId = row.key.replace('violations:','');
        if(violationsCache[interpId] !== undefined) violationsCache[interpId] = records;
      }
    }
    await storageSet('migration:tone-of-voice-v1', true);
  }catch(e){ console.error('tone-of-voice migration failed', e); }
}

// The items marked autoDnme in the catalog used to be logged with blank
// severity ("Flagged, no severity"). Now that flagging them means DNME
// automatically, this fills in DNME on every existing record that predates
// that change, so historical data reads consistently with new entries.
async function migrateAutoDnmeOnce(){
  const done = await storageGet('migration:auto-dnme-v1');
  if(done) return;
  try{
    const { data, error } = await supabaseClient.from('kv_store').select('key,value').like('key', 'violations:%');
    if(error){ console.error('auto-dnme migration scan failed', error); return; }
    for(const row of (data || [])){
      const records = Array.isArray(row.value) ? row.value : [];
      let changed = false;
      records.forEach(rec=>{
        (rec.items || []).forEach(it=>{
          const def = catalogItem(it.category, it.item);
          if(def && def.autoDnme && !it.severity){ it.severity = 'DNME'; changed = true; }
        });
      });
      if(changed){
        await storageSet(row.key, records);
        const interpId = row.key.replace('violations:','');
        if(violationsCache[interpId] !== undefined) violationsCache[interpId] = records;
      }
    }
    await storageSet('migration:auto-dnme-v1', true);
  }catch(e){ console.error('auto-dnme migration failed', e); }
}

        if(!url){ showToast('Upload failed — try again'); return; }
        setField(currentDate, inp.dataset.id, inp.dataset.upload, url);
        setField(currentDate, inp.dataset.id, inp.dataset.upload+'At', new Date().toISOString());
        setField(currentDate, inp.dataset.id, inp.dataset.upload+'By', currentManagerId);
        const ok = await saveDate(currentDate);
        if(ok){ refresh(); if(oldUrl) deleteScreenshot(oldUrl); }
      }catch(err){
        showToast('Could not process image');
      }
    });
  });

  // remove screenshot
  document.querySelectorAll('[data-remove-img]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Remove this screenshot? This cannot be undone.')) return;
      const field = btn.dataset.removeImg, id = btn.dataset.removeId;
      const oldUrl = attendanceCache[currentDate]?.[id]?.[field] || null;
      setField(currentDate, id, field, '');
      setField(currentDate, id, field+'At', '');
      setField(currentDate, id, field+'By', '');
      const ok = await saveDate(currentDate);
      if(ok){ refresh(); if(oldUrl) deleteScreenshot(oldUrl); }
    });
  });

  // thumbnails -> modal
  main.querySelectorAll('[data-view-img]').forEach(el=>{
    el.addEventListener('click', ()=> openImageModal(el.dataset.viewImg));
  });
}

// Filters Today's Log rows by name as you type — pure DOM show/hide, no data
// fetch and no re-render, so it's instant and never interrupts typing.
function applyTodaySearchFilter(){
  const query = todaySearchQuery.trim().toLowerCase();
  const rows = document.querySelectorAll('[data-search-name]');
  let visibleCount = 0;
  rows.forEach(row=>{
    const match = !query || row.dataset.searchName.includes(query);
    row.style.display = match ? '' : 'none';
    if(match) visibleCount++;
  });
  let noResults = document.getElementById('todaySearchNoResults');
  const table = document.querySelector('#main table');
  if(query && visibleCount === 0){
    if(!noResults && table){
      noResults = document.createElement('div');
      noResults.id = 'todaySearchNoResults';
      noResults.className = 'empty-state';
      noResults.innerHTML = `<div class="big">No matches</div><div>No interpreter name matches "${escapeHtml(todaySearchQuery)}".</div>`;
      table.insertAdjacentElement('afterend', noResults);
    }
  }else if(noResults){
    noResults.remove();
  }
}

function uploadCell(id, field, value, byManagerId, displayUrl){
  return `
    <div class="upload-cell">
      ${value
        ? (displayUrl ? `<img class="thumb" src="${displayUrl}" data-view-img="${displayUrl}">` : `<div class="thumb-empty" title="Could not load image">&#9888;</div>`)
        : `<div class="thumb-empty">&#128247;</div>`}
      <div>
        <div class="upload-actions">
          <label class="upload-label">${value ? 'Replace' : 'Upload'}
            <input type="file" accept="image/*" data-upload="${field}" data-id="${id}">
          </label>
          ${value ? `<button type="button" class="upload-label" style="color:var(--status-absent);border-color:var(--status-absent-soft);background:var(--status-absent-soft);" data-remove-img="${field}" data-remove-id="${id}">Remove</button>` : ''}
        </div>

      </div>
    </div>
  `;

function setField(dateStr, interpreterId, field, value){
  if(!attendanceCache[dateStr]) attendanceCache[dateStr] = {};
  if(!attendanceCache[dateStr][interpreterId]) attendanceCache[dateStr][interpreterId] = {};
  attendanceCache[dateStr][interpreterId][field] = value;
}

function shiftDate(dateStr, delta){
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + delta);
  return `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth()+1)}-${pad(dt.getUTCDate())}`;
}

// Builds the "Performance overview" panel for Monthly Overview: total flags
// this month, a top-4 flagged-violation chart, and per-interpreter flag counts.
async function renderPerformanceOverviewPanel(ids){
  await ensureViolationsLoadedFor(ids);
  const nameOf = id => (roster.find(p=>p.id===id)?.name) || '(removed)';

  let totalFlags = 0, pmeCount = 0, dnmeCount = 0, plainCount = 0;
  const itemCounts = {};
  const perInterpreter = {};
  ids.forEach(id=>{
    const monthRecords = (violationsCache[id]||[]).filter(v=>v.date.slice(0,7)===currentMonth);
    let count = 0;
    monthRecords.forEach(v=>{
      (v.items||[]).forEach(it=>{
        totalFlags++;
        count++;
        if(it.severity==='PME') pmeCount++;
        else if(it.severity==='DNME') dnmeCount++;
        else plainCount++;
        itemCounts[it.item] = (itemCounts[it.item]||0) + 1;
      });
    });
    perInterpreter[id] = count;
  });

  const topItems = Object.entries(itemCounts).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const maxTop = topItems.length ? topItems[0][1] : 0;
  const topInterpreters = ids.map(id=>({id, count: perInterpreter[id]})).sort((a,b)=>b.count-a.count);

  if(totalFlags === 0){
    return `
      <div class="panel" style="padding:18px 20px;margin-top:22px;">
        <div style="font-family:'Space Grotesk';font-size:14px;font-weight:600;margin-bottom:4px;">Performance overview</div>
        <div class="hint">No violations flagged for this team in ${currentMonth}.</div>
      </div>
    `;
  }

  return `
    <div class="panel" style="padding:18px 20px;margin-top:22px;">
      <div style="font-family:'Space Grotesk';font-size:14px;font-weight:600;margin-bottom:14px;">Performance overview</div>

      <div class="stat-row" style="margin-bottom:20px;">
        <div class="stat-chip"><div class="n">${totalFlags}</div><div class="l">Total flags</div></div>
        <div class="stat-chip"><div class="n">${pmeCount}</div><div class="l">PME</div></div>
        <div class="stat-chip"><div class="n">${dnmeCount}</div><div class="l">DNME</div></div>
        <div class="stat-chip"><div class="n">${plainCount}</div><div class="l">Flagged (no severity)</div></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
        <div>
          <div style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);margin-bottom:10px;">Top flagged violations</div>
          ${topItems.map(([item,count])=>`
            <div style="margin-bottom:10px;">
              <div style="display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:4px;">
                <span style="overflow-wrap:anywhere;">${escapeHtml(item)}</span><span style="font-family:'IBM Plex Mono';color:var(--ink-soft);flex-shrink:0;">${count}</span>
              </div>
              <span class="pct-bar" style="width:100%;"><span style="width:${maxTop ? Math.round(count/maxTop*100) : 0}%;background:var(--status-absent);"></span></span>
            </div>
          `).join('')}
        </div>
        <div>
          <div style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);margin-bottom:10px;">Flags by interpreter</div>
          ${topInterpreters.filter(x=>x.count>0).map(x=>`
            <div style="display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--border);">
              <span style="overflow-wrap:anywhere;">${escapeHtml(nameOf(x.id))}</span><span style="font-family:'IBM Plex Mono';color:var(--ink-soft);flex-shrink:0;">${x.count}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

                  <span class="chat-mini-avatar">${escapeHtml(chatInitial(o.name))}</span>
                  <span style="flex:1;font-size:11.5px;overflow-wrap:anywhere;">${escapeHtml(o.name)}${id===currentManagerId?' (you)':''}</span>
                  ${o.deafened ? `<span title="Deafened" style="font-size:9.5px;font-weight:700;color:var(--status-absent);flex-shrink:0;">DEAF</span>` : ''}
                  ${o.muted ? `<span title="Muted" style="font-size:11px;flex-shrink:0;">&#128263;</span>` : ''}
                </div>
              `).join('')}
            </div>` : ''}
          </button>
        `;}).join('')}

        <div class="chat-channels-group">Managers</div>
        ${otherManagers.map(m=>`
          <button class="chat-channel-btn" data-start-dm="${m.user_id}">
            <span style="position:relative;display:inline-flex;">${avatarHtml(m.user_id, sidebarAvatarUrls, 'chat-mini-avatar')}<span class="status-dot ${onlineManagers[m.user_id] ? 'online' : 'offline'}" style="position:absolute;bottom:-1px;right:-1px;border:1.5px solid #fff;"></span></span>
            ${escapeHtml(m.name)}
          </button>
        `).join('')}

        <div class="chat-new-channel">
          <div class="upload-actions" style="flex-direction:column;align-items:stretch;gap:6px;">
            <input type="text" id="newChannelName" placeholder="New channel name" style="font-size:12.5px;padding:7px 9px;border-radius:6px;border:1px solid var(--border);">
            <select id="newChannelType" style="font-size:12.5px;padding:7px 9px;border-radius:6px;border:1px solid var(--border);">
              <option value="text">Text</option>
              <option value="voice">Voice</option>
            </select>
            <button class="btn btn-sm btn-primary" id="createChannelBtn" style="justify-content:center;">+ Create</button>
          </div>
        </div>
      </div>
      <div class="chat-main" id="chatMain"></div>
    </div>
  `;

  document.querySelectorAll('[data-channel]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentChannelId = btn.dataset.channel; refresh(); });
  });
  document.querySelectorAll('[data-start-dm]').forEach(btn=>{
    btn.addEventListener('click', ()=> findOrCreateDM(btn.dataset.startDm));
  });
  document.getElementById('createChannelBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('newChannelName').value.trim();
    const type = document.getElementById('newChannelType').value;
    if(!name){ showToast('Enter a channel name'); return; }
    const ok = await createChannel(name, type);
    if(ok){ showToast('Channel created'); refresh(); }
  });
  document.getElementById('newGroupBtn').addEventListener('click', openNewGroupModal);

  if(!activeChannel){
    document.getElementById('chatMain').innerHTML = `<div class="empty-state"><div class="big">No channels yet</div></div>`;
    return;
  }

  if(activeChannel.type === 'voice'){
    await renderVoiceRoom();
  }else{
    chatRenderTarget = 'chatMain';
    await loadMessages(activeChannel.id);
    subscribeToChannelMessages(activeChannel.id);
    // The unread badge was already cleared earlier, before the sidebar
    // rendered — this just resets the "last seen" point new-message
    // notifications are measured against.
    setLastRead(activeChannel.id, new Date().toISOString());
    await renderChatMessages(true);
  }
}

async function renderChatMessages(isInitial){
  const el = document.getElementById(chatRenderTarget);
  if(!el) return;
  const embedded = chatRenderTarget !== 'chatMain';

  // Capture whatever's currently typed (and cursor position) before rebuilding
  // the DOM below — otherwise ANY re-render (opening the emoji picker, a
  // reaction changing, someone else's message arriving) would silently wipe
  // out an unsent draft, since the composer gets recreated from scratch.
  const existingInput = document.getElementById('chatBodyInput');
  const draftText = existingInput ? existingInput.value : '';
  const draftSelStart = existingInput ? existingInput.selectionStart : null;
  const draftSelEnd = existingInput ? existingInput.selectionEnd : null;
  const draftWasFocused = !!(existingInput && document.activeElement === existingInput);

  const channel = channels.find(c=>c.id===currentChannelId);
  if(!channel) return;
  if(channel.type === 'group' && channelMembersCache[channel.id] === undefined){
    await loadChannelMembers(channel.id);
  }
  const msgs = messagesCache[currentChannelId] || [];
  const signedUrls = await getChatSignedUrls(msgs.map(m=>m.attachment_path));
  const avatarUrls = await getAvatarUrlMapFor(msgs.map(m=>m.user_id));
  const unloadedReactionIds = msgs.map(m=>m.id).filter(id => messageReactions[id] === undefined);
  if(unloadedReactionIds.length) await loadReactionsFor(unloadedReactionIds);
  if(composerPickerOpen === 'stickers' && stickers.length === 0) await loadStickers();
  const stickerUrls = composerPickerOpen === 'stickers' ? await getChatSignedUrls(stickers.map(s=>s.storage_path)) : {};
  const pinned = msgs.filter(m=>m.pinned);
  const headerName = channel.type === 'dm' ? dmDisplayName(channel) : (channel.type === 'group' ? groupDisplayName(channel) : channel.name);
  const headerPrefix = (channel.type === 'dm' || channel.type === 'group') ? '' : '#&nbsp;';

  el.innerHTML = `
    ${embedded ? '' : `<div class="chat-header">${headerPrefix}${escapeHtml(headerName)}${!channel.is_fixed ? `<button class="btn btn-sm btn-danger" id="deleteChannelBtn">Delete channel</button>` : ''}</div>`}
    ${pinned.length ? `
      <div class="pinned-panel">
        <strong style="font-size:11px;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);">&#128204; Pinned (${pinned.length})</strong>
        ${pinned.map(m=>`
          <div class="pinned-panel-item">
            <span style="overflow-wrap:anywhere;"><strong>${escapeHtml(managerName(m.user_id))}:</strong> ${escapeHtml((m.body||'').slice(0,120))}</span>
            <button class="chat-msg-action" data-unpin="${m.id}">Unpin</button>
          </div>
        `).join('')}
      </div>
    ` : ''}
    <div class="chat-messages" id="chatMessagesList">
      ${msgs.length === 0 ? `<div class="hint" style="padding:20px;">No messages yet — say hello.</div>` : msgs.map(m=>{
        const name = managerName(m.user_id);
        const isSticker = m.attachment_type === 'image/sticker';
        const isImage = m.attachment_type && m.attachment_type.startsWith('image/');
        const url = signedUrls[m.attachment_path];
        const isMine = m.user_id === currentManagerId;
        const isEditing = editingMessageId === m.id;
        return `
        <div class="chat-msg ${m.pinned ? 'pinned' : ''}" data-msg-id="${m.id}">
          ${avatarHtml(m.user_id, avatarUrls, 'chat-msg-avatar')}
          <div style="min-width:0;flex:1;">
            <span class="chat-msg-name">${escapeHtml(name)}</span><span class="chat-msg-time">${fmtChatTime(m.created_at)}</span>
            ${m.edited_at ? `<span class="chat-msg-time">(edited)</span>` : ''}
            ${m.pinned ? `<span class="chat-msg-time">&#128204; pinned</span>` : ''}
            ${isEditing ? `
              <div class="chat-msg-edit-row">
                <textarea id="editBody_${m.id}" rows="1" style="flex:1;font-family:inherit;font-size:13.5px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);">${escapeHtml(m.body||'')}</textarea>
                <button class="btn btn-sm btn-primary" data-save-edit="${m.id}">Save</button>
                <button class="btn btn-sm" data-cancel-edit="${m.id}">Cancel</button>
              </div>
            ` : (m.body ? `<div class="chat-msg-body">${escapeHtml(m.body)}</div>` : '')}
            ${m.attachment_path ? `
              <div class="chat-msg-attach">
                ${isImage
                  ? (url ? `<img src="${url}" data-view-img="${url}" class="${isSticker?'sticker-img':''}">` : `<div class="hint">Image unavailable</div>`)
                  : `<a class="chat-msg-file" href="${url||'#'}" target="_blank" rel="noopener">&#128206; ${escapeHtml(m.attachment_name||'file')}</a>`}
              </div>` : ''}
            ${(()=>{
              const reactions = messageReactions[m.id] || [];
              if(reactions.length === 0) return '';
              const byEmoji = {};
              reactions.forEach(r=>{ (byEmoji[r.emoji] = byEmoji[r.emoji] || []).push(r); });
              return `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;">
                ${Object.entries(byEmoji).map(([emoji, list])=>{
                  const iReacted = list.some(r=>r.user_id === currentManagerId);
                  const names = list.map(r=>managerName(r.user_id)).join(', ');
                  return `<button class="reaction-pill ${iReacted?'mine':''}" data-toggle-reaction="${m.id}" data-emoji="${emoji}" title="${escapeAttr(names)}">${emoji} ${list.length}</button>`;
                }).join('')}
              </div>`;
            })()}
            ${!isEditing ? `
              <div style="margin-top:3px;position:relative;">
                ${isMine ? `<button class="chat-msg-action" data-edit-msg="${m.id}">Edit</button>` : ''}
                ${isMine ? `<button class="chat-msg-action" data-delete-msg="${m.id}" data-attach-path="${escapeAttr(m.attachment_path||'')}" data-is-sticker="${isSticker}">Delete</button>` : ''}
                <button class="chat-msg-action" data-toggle-pin="${m.id}" data-currently-pinned="${!!m.pinned}">${m.pinned ? 'Unpin' : 'Pin'}</button>
                <button class="chat-msg-action" data-open-reaction-picker="${m.id}">&#128512; React</button>
                ${reactionPickerForMessage === m.id ? `
                  <div class="reaction-picker">
                    ${EMOJI_SET.slice(0,20).map(e=>`<button data-toggle-reaction="${m.id}" data-emoji="${e}">${e}</button>`).join('')}
                  </div>
                ` : ''}
              </div>
            ` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="chat-composer" style="position:relative;">
      <label class="chat-attach-btn" title="Attach a file or image">&#128206;<input type="file" id="chatFileInput" style="display:none;"></label>
      <button type="button" class="chat-attach-btn" id="composerPickerBtn" title="Emoji &amp; stickers">&#128512;</button>
      <textarea id="chatBodyInput" placeholder="Message ${(channel.type==='dm'||channel.type==='group') ? escapeHtml(headerName) : '#'+escapeHtml(channel.name)}" rows="1"></textarea>
      <button class="btn btn-primary" id="chatSendBtn">Send</button>
      ${composerPickerOpen ? `
        <div class="composer-picker">
          <div class="composer-picker-tabs">
            <button class="${composerPickerOpen==='emoji'?'active':''}" data-picker-tab="emoji">Emoji</button>
            <button class="${composerPickerOpen==='stickers'?'active':''}" data-picker-tab="stickers">Stickers</button>
          </div>
          ${composerPickerOpen === 'emoji' ? `
            <div class="composer-picker-grid">
              ${EMOJI_SET.map(e=>`<button data-insert-emoji="${e}">${e}</button>`).join('')}
            </div>
          ` : `
            <div class="composer-picker-grid stickers">
              ${stickers.length === 0 ? `<div class="hint" style="padding:10px;">No stickers yet — upload one below.</div>` : ''}
              ${stickers.map(s=>`<button data-send-sticker="${s.id}" title="${escapeAttr(s.name||'')}">${stickerUrls[s.storage_path] ? `<img src="${stickerUrls[s.storage_path]}" class="sticker-thumb">` : ''}</button>`).join('')}
            </div>
            <div style="padding:8px 10px;border-top:1px solid var(--border);">
              <label class="btn btn-sm" style="width:100%;justify-content:center;cursor:pointer;">+ Upload sticker
                <input type="file" id="stickerUploadInput" accept="image/*" style="display:none;">
              </label>
            </div>
          `}
        </div>
      ` : ''}
    </div>
  `;

  // Restore whatever was typed before this render, so opening the emoji
  // picker or a reaction arriving live never loses an unsent draft.
  if(draftText){
    const newInput = document.getElementById('chatBodyInput');
    if(newInput){
      newInput.value = draftText;
      if(draftWasFocused){
        newInput.focus();
        if(draftSelStart !== null) newInput.selectionStart = newInput.selectionEnd = Math.min(draftSelEnd || draftSelStart, draftText.length);
      }
    }
  }

  const list = document.getElementById('chatMessagesList');
  if(list && !editingMessageId) list.scrollTop = list.scrollHeight;

  if(!embedded){
    const delBtn = document.getElementById('deleteChannelBtn');
    if(delBtn){
      delBtn.addEventListener('click', async ()=>{
        if(!confirm(`Delete this ${channel.type==='dm'?'conversation':'channel'}? This deletes all its messages too.`)) return;
        const ok = await deleteChannelById(channel.id);
        if(ok){ currentChannelId = null; refresh(); }
      });
    }
  }

  const msgTargetEl = document.getElementById(chatRenderTarget);
  if(msgTargetEl){
    msgTargetEl.querySelectorAll('[data-view-img]').forEach(img=>{
      img.addEventListener('click', ()=> openImageModal(img.dataset.viewImg));
    });
  }

  document.querySelectorAll('[data-edit-msg]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ editingMessageId = btn.dataset.editMsg; renderChatMessages(); });
  });
  document.querySelectorAll('[data-delete-msg]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Delete this message? This cannot be undone.')) return;
      const isSticker = btn.dataset.isSticker === 'true';
      const ok = await deleteMessage(btn.dataset.deleteMsg, btn.dataset.attachPath, isSticker);
      if(ok) renderChatMessages();
    });
  });
  document.querySelectorAll('[data-cancel-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ editingMessageId = null; renderChatMessages(); });
  });
  document.querySelectorAll('[data-save-edit]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.saveEdit;
      const newBody = document.getElementById('editBody_'+id).value.trim();
      if(!newBody){ showToast('Message cannot be empty'); return; }
      const { error } = await supabaseClient.from('messages').update({ body: newBody, edited_at: new Date().toISOString() }).eq('id', id);
      if(error){ console.error('edit message failed', error); showToast('Could not save edit'); return; }
      const cache = messagesCache[currentChannelId];
      const rec = cache && cache.find(m=>m.id===id);
      if(rec){ rec.body = newBody; rec.edited_at = new Date().toISOString(); }
      editingMessageId = null;
      renderChatMessages();
    });
  });
  document.querySelectorAll('[data-toggle-pin]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.togglePin;
      const currentlyPinned = btn.dataset.currentlyPinned === 'true';
      const patch = currentlyPinned
        ? { pinned: false, pinned_by: null, pinned_at: null }
        : { pinned: true, pinned_by: currentManagerId, pinned_at: new Date().toISOString() };
      const { error } = await supabaseClient.from('messages').update(patch).eq('id', id);
      if(error){ console.error('pin toggle failed', error); showToast('Could not update pin'); return; }
      const cache = messagesCache[currentChannelId];
      const rec = cache && cache.find(m=>m.id===id);
      if(rec) Object.assign(rec, patch);
      renderChatMessages();
    });
  });
  document.querySelectorAll('[data-unpin]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.unpin;
      const { error } = await supabaseClient.from('messages').update({ pinned: false, pinned_by: null, pinned_at: null }).eq('id', id);
      if(error){ console.error('unpin failed', error); return; }
      const cache = messagesCache[currentChannelId];
      const rec = cache && cache.find(m=>m.id===id);
      if(rec){ rec.pinned = false; rec.pinned_by = null; rec.pinned_at = null; }
      renderChatMessages();
    });
  });

  const send = async ()=>{
    const body = document.getElementById('chatBodyInput').value;
    const file = document.getElementById('chatFileInput').files[0];
    if(!body.trim() && !file) return;
    document.getElementById('chatSendBtn').disabled = true;
    const ok = await sendChatMessage(currentChannelId, body, file);
    if(ok){
      document.getElementById('chatBodyInput').value = '';
      document.getElementById('chatFileInput').value = '';
    }else{
      document.getElementById('chatSendBtn').disabled = false;
    }
  };
  document.getElementById('chatSendBtn').addEventListener('click', send);
  document.getElementById('chatBodyInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });

  // Reactions: the small "React" trigger opens a quick-pick popup; clicking
  // a reaction pill (whether it's the trigger popup or an existing pill on
  // the message) toggles your own reaction for that emoji.
  document.querySelectorAll('[data-open-reaction-picker]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.openReactionPicker;
      reactionPickerForMessage = reactionPickerForMessage === id ? null : id;
      renderChatMessages();
    });
  });
  document.querySelectorAll('[data-toggle-reaction]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      await toggleReaction(btn.dataset.toggleReaction, btn.dataset.emoji);
      renderChatMessages();
    });
  });

  // Composer emoji/sticker picker
  const pickerBtn = document.getElementById('composerPickerBtn');
  if(pickerBtn) pickerBtn.addEventListener('click', ()=>{
    composerPickerOpen = composerPickerOpen ? null : 'emoji';
    renderChatMessages();
  });
  document.querySelectorAll('[data-picker-tab]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      composerPickerOpen = btn.dataset.pickerTab;
      if(composerPickerOpen === 'stickers' && stickers.length === 0) await loadStickers();
      renderChatMessages();
    });
  });
  document.querySelectorAll('[data-insert-emoji]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const input = document.getElementById('chatBodyInput');
      const emoji = btn.dataset.insertEmoji;
      const start = input.selectionStart || input.value.length;
      const end = input.selectionEnd || input.value.length;
      input.value = input.value.slice(0, start) + emoji + input.value.slice(end);
      input.focus();
      input.selectionStart = input.selectionEnd = start + emoji.length;
    });
  });
  document.querySelectorAll('[data-send-sticker]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const sticker = stickers.find(s=>s.id === btn.dataset.sendSticker);
      if(!sticker) return;
      const ok = await sendSticker(sticker);
      if(ok) renderChatMessages();
    });
  });
  const stickerUploadInput = document.getElementById('stickerUploadInput');
  if(stickerUploadInput) stickerUploadInput.addEventListener('change', async ()=>{
    const file = stickerUploadInput.files[0];
    if(!file) return;
    showToast('Uploading sticker…');
    const ok = await uploadSticker(file);
    if(ok){ showToast('Sticker added'); renderChatMessages(); }
  });

  // Clicking anywhere outside an open picker closes it — standard popup behavior.
  document.addEventListener('click', function closePickers(e){
    if(composerPickerOpen && !e.target.closest('.composer-picker') && !e.target.closest('#composerPickerBtn')){
      composerPickerOpen = null;
      renderChatMessages();
    }
    if(reactionPickerForMessage && !e.target.closest('.reaction-picker') && !e.target.closest('[data-open-reaction-picker]')){
      reactionPickerForMessage = null;
      renderChatMessages();
    }
  }, { once: true });
}

async function renderVoiceRoom(){
  const el = document.getElementById('chatMain');
  if(!el) return;
  const channel = channels.find(c=>c.id===currentChannelId);
  if(!channel) return;
  const inThisRoom = voiceChannelId === channel.id;
  const occupants = voiceChannelOccupants[channel.id] || {};
  const participantIds = Object.keys(occupants);
  const voiceAvatarUrls = await getAvatarUrlMapFor(participantIds);

  el.innerHTML = `
    <div class="chat-header">&#128266;&nbsp;${escapeHtml(channel.name)}${!channel.is_fixed ? `<button class="btn btn-sm btn-danger" id="deleteChannelBtn">Delete channel</button>` : ''}</div>
    <div class="voice-room-compact">
      <div class="voice-participants">
        ${inThisRoom && participantIds.length ? participantIds.map(id=>`
          <div class="voice-avatar" id="voice-avatar-${id}">${avatarHtml(id, voiceAvatarUrls, 'circle')}<div class="vname">${occupants[id].deafened ? '<span style="font-weight:700;color:var(--status-absent);">DEAF</span> ' : ''}${occupants[id].muted ? '&#128263; ' : ''}${escapeHtml(occupants[id].name)}${id===currentManagerId?' (you)':''}</div></div>
        `).join('') : `<div class="hint">${inThisRoom ? "You're the only one here right now." : 'Nobody in this call yet.'}</div>`}
      </div>
      <div class="voice-controls">
        ${inThisRoom ? `
          <button class="btn ${voiceMuted?'btn-danger':''}" id="voiceMuteBtn">${voiceMuted ? '&#128263; Unmute' : '&#127908; Mute'}</button>
          <button class="btn ${voiceDeafened?'btn-danger':''}" id="voiceDeafenBtn">${voiceDeafened ? '&#128264; Undeafen' : '&#127911; Deafen'}</button>
          <button class="btn btn-danger" id="voiceLeaveBtn">Leave call</button>
        ` : `<button class="btn btn-primary" id="voiceJoinBtn">Join voice</button>`}
      </div>
    </div>
    <div id="voiceChatMessages" style="flex:1;display:flex;flex-direction:column;min-height:0;"></div>
  `;

  const delBtn = document.getElementById('deleteChannelBtn');
  if(delBtn){
    delBtn.addEventListener('click', async ()=>{
      if(!confirm(`Delete voice channel "${channel.name}"?`)) return;
      if(voiceChannelId === channel.id) await leaveVoiceChannel();
      const ok = await deleteChannelById(channel.id);
      if(ok){ currentChannelId = null; refresh(); }
    });
  }

  const joinBtn = document.getElementById('voiceJoinBtn');
  if(joinBtn) joinBtn.addEventListener('click', ()=> runVoiceAction(async ()=>{ await joinVoiceChannel(channel.id); await refreshVoiceUI(); }));
  const leaveBtn = document.getElementById('voiceLeaveBtn');
  if(leaveBtn) leaveBtn.addEventListener('click', ()=> runVoiceAction(async ()=>{ await leaveVoiceChannel(); await refreshVoiceUI(); }));
  const muteBtn = document.getElementById('voiceMuteBtn');
  if(muteBtn) muteBtn.addEventListener('click', ()=> runVoiceAction(async ()=>{ await toggleVoiceMute(); await refreshVoiceUI(); }));
  const deafenBtn = document.getElementById('voiceDeafenBtn');
  if(deafenBtn) deafenBtn.addEventListener('click', ()=> runVoiceAction(async ()=>{ await toggleDeafen(); await refreshVoiceUI(); }));
  document.querySelectorAll('.voice-participants [data-view-img]').forEach(img=>{
    img.addEventListener('click', ()=> openImageModal(img.dataset.viewImg));
  });

  // Persistent chat for this voice channel — same messaging system as every
  // other channel, just embedded below the controls instead of filling the
  // whole panel.
  chatRenderTarget = 'voiceChatMessages';
  await loadMessages(channel.id);
  subscribeToChannelMessages(channel.id);
  setLastRead(channel.id, new Date().toISOString());
  await renderChatMessages();
}

function exportMonthCsv(){
  ensureMonthLoaded(currentMonth).then(()=>{
    const n = daysInMonth(currentMonth);
    const todayYm = todayStr().slice(0,7);
    const lastDay = (currentMonth === todayYm) ? Number(todayStr().slice(8,10)) : n;
    const idSet = new Set(roster.map(p=>p.id));
    for(let d=1; d<=lastDay; d++){
      const day = attendanceCache[currentMonth + '-' + pad(d)] || {};
      Object.keys(day).forEach(id=>idSet.add(id));
    }
    const nameOf = id => (roster.find(p=>p.id===id)?.name) || '(removed)';
    const ids = [...idSet].sort((a,b)=> nameOf(a).localeCompare(nameOf(b)));
    let rows = [['Interpreter', ...Array.from({length:lastDay},(_,i)=>'Day '+(i+1))]];
    ids.forEach(id=>{
      const row = [nameOf(id)];
      for(let d=1; d<=lastDay; d++){
        const s = (attendanceCache[currentMonth+'-'+pad(d)]||{})[id]?.status || '';
        row.push(s);
      }
      rows.push(row);
    });
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `qa-ninjas-attendance-${currentMonth}.csv`;
    a.click();
  });
}

}
function itemOptionsHtml(category, selectedItem){
  const cat = VIOLATION_CATALOG.find(c=>c.category===category) || VIOLATION_CATALOG[0];
  return cat.items.map(i=>`<option value="${escapeAttr(i.label)}" ${i.label===selectedItem?'selected':''}>${escapeHtml(i.label)}</option>`).join('');
}
function severityBadge(severity){
  if(severity === 'PME') return `<span class="sev-badge sev-PME">PME</span>`;
  if(severity === 'DNME') return `<span class="sev-badge sev-DNME">DNME</span>`;
  return `<span class="sev-badge sev-NA">Flagged</span>`;
}
// Wires a category-select + item-select + severity-select trio so item options and
// severity visibility update live as the manager picks a category/item.
function wireCatItemSev(catSel, itemSel, sevSel){
  const refreshSeverity = ()=>{
    const item = catalogItem(catSel.value, itemSel.value);
    const applies = item ? item.severity : true;
    sevSel.style.display = applies ? '' : 'none';
    if(!applies) sevSel.value = '';
  };
  catSel.addEventListener('change', ()=>{
    itemSel.innerHTML = itemOptionsHtml(catSel.value);
    refreshSeverity();
  });
  itemSel.addEventListener('change', refreshSeverity);
  refreshSeverity();
}

      showToast(`Imported: ${s.autoLogged} logged, ${s.alreadyMatched} already correct, ${s.mismatched + s.unmatchedInterpreter + s.unmatchedManager} need review`);

      const note = document.getElementById('vNote').value.trim();

      VIOLATION_CATALOG.forEach((cat,ci)=>{

            }

      });

      if(toFlag.length === 0){ showToast('Check at least one violation to flag'); return; }
      if(missingSeverity){ showToast('Pick a severity (PME or DNME) for each checked item that needs one'); return; }

        loggedBy: currentManagerId, createdAt: new Date().toISOString()
      });
      const ok = await saveViolations(interpId);
      if(ok){ showToast(`Flagged ${toFlag.length} violation${toFlag.length>1?'s':''}`); refresh(); }
    });
  }

  renderPerformanceBody(scope);
}

function renderPerformanceBody(scope){
  const body = document.getElementById('perfBody');
  const nameOf = id => (roster.find(p=>p.id===id)?.name) || '(removed)';

  const filteredScope = perfInterpreterFilter ? scope.filter(p=>p.id===perfInterpreterFilter) : scope;

  // Monthly + all-time counts per interpreter, broken down by the specific
  // violation item flagged (not just its broad category) — e.g. "Transparency ×1".
  // Counts individual violations (items), not QAR submissions (records), since
  // one submission can hold several.
  const stats = {};
  filteredScope.forEach(p=>{
    const all = violationsCache[p.id] || [];
    const monthRecords = all.filter(v=>v.date.slice(0,7) === currentMonth);
    const byItem = {};
    let monthItemCount = 0, allItemCount = 0;
    all.forEach(v=> allItemCount += (v.items||[]).length);
    monthRecords.forEach(v=>{
      (v.items||[]).forEach(it=>{
        byItem[it.item] = (byItem[it.item]||0) + 1;
        monthItemCount++;
      });
    });
    stats[p.id] = { total: allItemCount, thisMonth: monthItemCount, byItem };
  });

  // Flat list of this month's QAR records across the filtered scope, most recent first.
  const monthLog = [];
  filteredScope.forEach(p=>{
    (violationsCache[p.id]||[]).filter(v=>v.date.slice(0,7)===currentMonth).forEach(v=>{
      monthLog.push({ interpreterId: p.id, ...v });
    });
  });
  monthLog.sort((a,b)=> b.date.localeCompare(a.date) || (a.createdAt||'').localeCompare(b.createdAt||''));

  if(filteredScope.length === 0){
    body.innerHTML = `<div class="panel"><div class="empty-state"><div class="big">No interpreter selected</div><div>Pick a different interpreter, or choose "All interpreters" above.</div></div></div>`;
    return;
  }

  const monthLogTotalItems = monthLog.reduce((sum,v)=> sum + (v.items||[]).length, 0);

  body.innerHTML = `
    <div class="stat-row" style="margin-bottom:20px;">
      <div class="stat-chip"><div class="n">${monthLog.length}</div><div class="l">Logs this month</div></div>
      <div class="stat-chip"><div class="n">${monthLogTotalItems}</div><div class="l">Violations flagged</div></div>
    </div>

    <div class="panel" style="margin-bottom:22px;">
      <div class="summary-scroll">
      <table class="month-summary violation-summary">
        <thead><tr>
          <th style="width:150px;">Interpreter</th><th style="width:90px;">This month</th><th style="width:90px;">All-time</th>
          <th>Violations flagged this month</th>
        </tr></thead>
        <tbody>
          ${filteredScope.map(p=>{
            const items = Object.entries(stats[p.id].byItem).sort((a,b)=>b[1]-a[1]);
            return `
            <tr>
              <td style="font-family:'Inter';font-size:13.5px;">${escapeHtml(p.name)}</td>
              <td>${stats[p.id].thisMonth}</td>
              <td>${stats[p.id].total}</td>
              <td>${items.length ? items.map(([item,count])=>`<span class="item-pill">${escapeHtml(item)} ×${count}</span>`).join(' ') : '<span style="color:var(--ink-faint);">—</span>'}</td>
            </tr>
          `;}).join('')}
        </tbody>
      </table>
      </div>
    </div>

    <div class="panel">
      ${monthLog.length === 0 ? `
        <div class="empty-state">
          <div class="big">No flags this month</div>
          <div>Nice — nothing logged for this team in ${currentMonth}.</div>
        </div>
      ` : `
      <table>
        <thead><tr>
          <th style="width:110px">Date</th>
          <th style="width:130px">QAR ID</th>
          <th style="width:150px">Interpreter</th>
          <th style="width:340px">Violation(s)</th>
          <th>Note</th>
          <th style="width:60px"></th>
        </tr></thead>
        <tbody>
          ${monthLog.map(v=>`
            <tr data-vid="${v.id}" data-pid="${v.interpreterId}">
              <td><input type="date" class="note-input" data-vfield="date" value="${v.date}"></td>
              <td><input type="text" class="note-input qar-tag" data-vfield="qar" value="${escapeAttr(v.qar||'')}" placeholder="QAR ID"></td>
              <td>${escapeHtml(nameOf(v.interpreterId))}<div class="interp-role">by ${escapeHtml(managerName(v.loggedBy))}</div>${v.autoImported ? `<div class="interp-role" style="color:var(--status-late);">auto-imported</div>` : ''}</td>
              <td>
                ${(v.items||[]).map((it,idx)=>`
                  <div class="qar-item-row" data-item-idx="${idx}" style="display:flex;align-items:center;gap:5px;margin-bottom:6px;flex-wrap:wrap;">
                    <select class="note-input" data-vfield="category" style="min-width:140px;">${violationOptionsHtml(it.category)}</select>
                    <select class="note-input" data-vfield="item" style="min-width:140px;">${itemOptionsHtml(it.category, it.item)}</select>
                    <select class="note-input" data-vfield="severity" style="width:90px;${catalogItem(it.category, it.item)?.severity ? '' : 'display:none;'}">
                      <option value="">—</option>
                      <option value="PME" ${it.severity==='PME'?'selected':''}>PME</option>
                      <option value="DNME" ${it.severity==='DNME'?'selected':''}>DNME</option>
                    </select>
                    ${!catalogItem(it.category, it.item)?.severity ? severityBadge(it.severity) : ''}
                    ${(v.items||[]).length > 1 ? `<button type="button" class="btn btn-sm btn-danger" data-item-remove title="Remove this violation">×</button>` : ''}
                  </div>
                `).join('')}
              </td>
              <td><input type="text" class="note-input" data-vfield="note" value="${escapeAttr(v.note||'')}" placeholder="Note…"></td>
              <td><button class="btn btn-sm btn-danger" data-vdelete="${v.id}" data-vpid="${v.interpreterId}">Del</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>`}
    </div>
  `;

  // wire per-row date/qar/note + per-item category/item/severity/remove
  document.querySelectorAll('[data-vid]').forEach(row=>{
    const vid = row.dataset.vid, pid = row.dataset.pid;
    const dateInp = row.querySelector('[data-vfield="date"]');
    const qarInp = row.querySelector('[data-vfield="qar"]');
    const noteInp = row.querySelector('[data-vfield="note"]');

    const findRecord = ()=> (violationsCache[pid]||[]).find(x=>x.id===vid);

    const persistHeader = async ()=>{
      const rec = findRecord();
      if(!rec) return;
      rec.date = dateInp.value || rec.date;
      rec.qar = qarInp.value.trim();
      rec.note = noteInp.value.trim();
      await saveViolations(pid);
    };
    dateInp.addEventListener('change', async ()=>{ await persistHeader(); refresh(); });
    qarInp.addEventListener('change', persistHeader);
    noteInp.addEventListener('change', persistHeader);

    row.querySelectorAll('.qar-item-row').forEach(itemRow=>{
      const idx = Number(itemRow.dataset.itemIdx);
      const catSel = itemRow.querySelector('[data-vfield="category"]');
      const itemSel = itemRow.querySelector('[data-vfield="item"]');
      const sevSel = itemRow.querySelector('[data-vfield="severity"]');
      const removeBtn = itemRow.querySelector('[data-item-remove]');

      wireCatItemSev(catSel, itemSel, sevSel);

      const persistItem = async ()=>{
        const rec = findRecord();
        if(!rec || !rec.items[idx]) return;
        rec.items[idx].category = catSel.value;
        rec.items[idx].item = itemSel.value;
        const def = catalogItem(rec.items[idx].category, rec.items[idx].item);
        rec.items[idx].severity = def && def.severity ? sevSel.value : (def && def.autoDnme ? 'DNME' : '');
        await saveViolations(pid);
      };
      [catSel, itemSel, sevSel].forEach(el=> el.addEventListener('change', async ()=>{ await persistItem(); refresh(); }));

      if(removeBtn){
        removeBtn.addEventListener('click', async ()=>{
          const rec = findRecord();
          if(!rec) return;
          if(!confirm('Remove this violation from the log?')) return;
          rec.items.splice(idx, 1);
          await saveViolations(pid);
          refresh();
        });
      }
    });
  });

  document.querySelectorAll('[data-vdelete]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const pid = btn.dataset.vpid, vid = btn.dataset.vdelete;
      if(!confirm('Delete this entire log entry (all violations under this QAR)? This cannot be undone.')) return;
      violationsCache[pid] = (violationsCache[pid]||[]).filter(x=>x.id!==vid);
      await saveViolations(pid);
      refresh();
    });
  });
}

function exportPerformanceCsv(){
  const allActive = roster.filter(p=>p.active !== false);
  const scope = viewFilter === 'mine' ? allActive.filter(p=>p.managerId === currentManagerId) : allActive;
  const filteredScope = perfInterpreterFilter ? scope.filter(p=>p.id===perfInterpreterFilter) : scope;
  ensureViolationsLoadedFor(filteredScope.map(p=>p.id)).then(()=>{
    const rows = [['Date','QAR ID','Interpreter','Category','Item','Severity','Note','Logged by']];
    filteredScope.forEach(p=>{
      (violationsCache[p.id]||[]).filter(v=>v.date.slice(0,7)===currentMonth).forEach(v=>{
        (v.items||[]).forEach(it=>{
          rows.push([v.date, v.qar||'', p.name, it.category, it.item, it.severity||'', v.note||'', managerName(v.loggedBy)]);
        });
      });
    });
    const csv = rows.map(r=>r.map(val=>`"${String(val).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `qa-ninjas-performance-${currentMonth}.csv`;
    a.click();
  });
}
